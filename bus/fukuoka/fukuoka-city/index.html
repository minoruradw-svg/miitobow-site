function orderRoute(r) {
  const by = new Map();
  r.stops.forEach(s => { const a = by.get(s.name) || { name: s.name, la: 0, lo: 0, c: 0, st: [] }; a.la += s.lat; a.lo += s.lon; a.c++; a.st.push(s); by.set(s.name, a); });

  const n = P.length; if (n <= 2) return P.sort((a, b) => a.x - b.x).map(p => p.name);
  const d = (a, b) => Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y);
  // Prim法で最小全域木
  const par = new Array(n).fill(-1), best = new Array(n).fill(Infinity), inT = new Array(n).fill(false), adj = P.map(() => []);
  best[0] = 0;
  for (let k = 0; k < n; k++) {
    let u = -1; for (let i = 0; i < n; i++) if (!inT[i] && (u < 0 || best[i] < best[u])) u = i;
    inT[u] = true; if (par[u] >= 0) { adj[u].push(par[u]); adj[par[u]].push(u); }
    for (let v = 0; v < n; v++) if (!inT[v]) { const w = d(u, v); if (w < best[v]) { best[v] = w; par[v] = u; } }
  }
  const bfs = src => { const dist = new Array(n).fill(-1), prev = new Array(n).fill(-1); dist[src] = 0; const q = [src];
    for (let h = 0; h < q.length; h++) { const u = q[h]; adj[u].forEach(v => { if (dist[v] < 0) { dist[v] = dist[u] + 1; prev[v] = u; q.push(v); } }); }
    return { dist, prev }; };
  const far = res => res.dist.indexOf(Math.max(...res.dist));
  const A = far(bfs(0)); const rb = bfs(A); const B = far(rb);
  let path = []; for (let v = B; v >= 0; v = rb.prev[v]) path.push(v);   // B→A
  path.reverse();                                                       // A→B
  if (P[path[0]].x > P[path[path.length - 1]].x) path.reverse();        // 西の端から始める
  // 軸に乗らないバス停は、軸に最短でつながる地点の直後に入れる
  const onPath = new Map(path.map((v, i) => [v, i])), anchor = new Array(n).fill(-1), depth = new Array(n).fill(0), q = [];
  path.forEach((v, i) => { anchor[v] = i; q.push(v); });
  for (let h = 0; h < q.length; h++) { const u = q[h]; adj[u].forEach(v => { if (anchor[v] < 0) { anchor[v] = anchor[u]; depth[v] = depth[u] + 1; q.push(v); } }); }
  const groups = path.map(() => []); for (let v = 0; v < n; v++) if (!onPath.has(v)) groups[anchor[v]].push(v);
  const out = []; path.forEach((v, i) => { out.push(v); groups[i].sort((a, b) => depth[a] - depth[b] || d(v, a) - d(v, b)).forEach(x => out.push(x)); });
  return out.map(i => P[i].name);
}

// ---- 場所（駅・地名・施設）：地図をその周辺へ動かし、近くのバス停を一覧する。系統一覧は自動では開かない ----
const PTYPE_ZOOM = { 駅: 16, 役所: 16, 商業: 16, 病院: 16, 施設: 16, 地名: 15, 公園: 15, 観光: 15, 交通: 15 };
const areaRank = a => { const i = AREA_ORDER.indexOf(a); return i < 0 ? 999 : i; };   // 同名の地名は、設定の区の並びの早いほうを先に
const PTYPE_ORDER =["地名", "駅", "役所", "観光", "商業", "公園", "病院", "交通", "施設"];
const places = PLACES.map(a => ({ name: a[0], type: a[1], lat: a[2], lon: a[3], area: a[4], sub: a[5], alias: a[6] }));
const pnorm = s => s.normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/ゖ/g, "け");   // ケ/ヶ/ヵの表記ゆれもそろえる   // カタカナ→ひらがなにそろえる(場所の検索だけ)
const placeItems = places.map(p => ({ t: "p", p, name: pnorm(p.name), key: pnorm([p.name, p.name.replace(/駅$/, ""), p.alias].join(" ")) }));

const pkind = p => p.type === "地名" ? "代表地点" : p.type === "駅" ? "駅の位置" : "所在地";
const ptip = p => p.type === "地名" ? "地図をこの地域の代表地点へ動かしました。範囲の中心とは限りません。" : p.type === "駅" ? "地図を駅の付近へ動かしました（位置は目安です）。" : "地図を施設の所在地付近へ動かしました。出入口の位置とは限りません。";

function nearStops(p) {
  const by = new Map();
  stops.forEach(s => { const d = Math.hypot((s.lon - p.lon) * 91000, (s.lat - p.lat) * 111000), o = by.get(s.name);
    if (!o || d < o.d) by.set(s.name, { s, d }); });
  const all = [...by.values()].sort((a, b) => a.d - b.d);

  return near.length ? { list: near, far: false } : { list: all.slice(0, 3), far: true };
}
// ---- 一覧から探す：地名＝区ごと／駅＝路線ごと。選ぶと showPlace と同じ表示になり、「もどる」で一覧へ戻る ----

const AREA_ORDER = ["福岡市中央区", "福岡市博多区", "福岡市東区", "福岡市南区", "福岡市西区", "福岡市城南区", "福岡市早良区", "春日市", "大野城市", "太宰府市", "筑紫野市", "那珂川市", "古賀市", "福津市", "糸島市", "糟屋郡宇美町", "糟屋郡篠栗町", "糟屋郡志免町", "糟屋郡須恵町", "糟屋郡新宮町", "糟屋郡久山町", "糟屋郡粕屋町"];

function showPlace(p, opt) {

  ${ns.list.map(x => `<button class="rt" type="button" data-s="${x.s.i}"><span>${esc(x.s.name)}</span><small>約${Math.max(10, Math.round(x.d / 10) * 10)}m・${x.s.rts.length}系統</small></button>`).join("")}${NOTE}`,

}
function showRoute(r) {

  setCur(lastStop && r.set.has(lastStop) ? [lastStop] : []);

  <p class="tip">※元データに停車順が無いため、位置から推定した順です。実際の運行順・向きとずれることがあります（枝分かれする系統は特に）。名前を押すと地図でその場所に寄ります。</p>
  <ol class="stoplist">${r.order.map(n => `<li><button type="button" data-n="${esc(n)}">${esc(n)}</button></li>`).join("")}</ol>${NOTE}`,

// フィルタ
const chips = document.getElementById("chips"), chipEls = {};

// 検索（Enter／↑↓／Escに対応。判定ロジックは従来どおり）
const q = document.getElementById("q"), sug = document.getElementById("sug"), qclear = document.getElementById("qclear");
const kana = t => t.normalize("NFKC").toLowerCase();
const items = [...routes.map(r => ({ t: "r", r, key: kana(routeLabel(r) + " " + OPNAME(r.op)) })),
  ...stops.map(s => ({ t: "s", s, key: kana(s.name) }))];
let hit = [], act = -1;
const showSug = v => { sug.hidden = !v; q.setAttribute("aria-expanded", String(v)); if (!v) q.removeAttribute("aria-activedescendant"); };
function pick(it) {
  showSug(false); q.value = ""; qclear.hidden = true; act = -1; placeBack = null;
  if (it.t === "p") { showPlace(it.p); return; }
  lastPlace = null; clearPin();     // 場所から離れて、検索で別のバス停・系統を選んだ時
  it.t === "r" ? showRoute(it.r) : (showStop(it.s, { center: true, zoom: 16 }), ensureVisible(L.latLng(it.s.lat, it.s.lon)));
}
function setAct(k) {
  act = k; if (k >= 0) q.setAttribute("aria-activedescendant", "sug-" + k);
  sug.querySelectorAll("button[data-k]").forEach((b, i) => { b.classList.toggle("act", i === act); b.setAttribute("aria-selected", i === act); if (i === act) b.scrollIntoView({ block: "nearest" }); });
}
function search() {
  const raw = q.value.trim(), v = kana(raw); act = -1; qclear.hidden = !q.value;
  if (!v) { showSug(false); return; }
  hit = items.filter(it => it.key.includes(v));
  hit.sort((a, b) => (a.t === b.t ? 0 : a.t === "r" ? -1 : 1) || (a.key.startsWith(v) ? 0 : 1) - (b.key.startsWith(v) ? 0 : 1));
  hit = hit.slice(0, 40);
  // 場所（駅・地名・施設）は別の候補群として先頭に追加。既存のバス停・系統の判定と並びは変えない
  const pv = pnorm(raw);
  const ph = placeItems.filter(it => it.key.includes(pv)).map(it => ({ it, sc: it.name === pv ? 0 : it.name.startsWith(pv) ? 1 : 2 }))
    .sort((a, b) => a.sc - b.sc || PTYPE_ORDER.indexOf(a.it.p.type) - PTYPE_ORDER.indexOf(b.it.p.type) || a.it.p.name.length - b.it.p.name.length || areaRank(a.it.p.area) - areaRank(b.it.p.area)).slice(0, 8).map(x => x.it);
  hit = ph.concat(hit);
  if (!hit.length) {
    sug.innerHTML = `<div class="empty"><b>「${esc(raw)}」</b>に合う場所・バス停・系統は見つかりませんでした。<br>・駅名・町名・地名・施設名（例：天神、博多駅、福岡空港）<br>・停留所名の一部（例：天神）<br>・系統の数字（例：26）<br>で試してみてください。</div>`;
  } else {
    let html = "", cur = "";
    hit.forEach((it, k) => {
      if (it.t !== cur) { cur = it.t; html += `<div class="sh" role="presentation">${it.t === "p" ? "場所" : it.t === "r" ? "系統" : "バス停"}</div>`; }
      html += it.t === "p"
        ? `<button type="button" role="option" id="sug-${k}" data-k="${k}"><span>${esc(it.p.name)}</span><small>${esc(placeSub(it.p))}</small></button>`
        : it.t === "r"
        ? `<button type="button" role="option" id="sug-${k}" data-k="${k}"><span>${esc(routeLabel(it.r))}</span><small>${esc(OPNAME(it.r.op))}・${it.r.n}か所</small></button>`
        : `<button type="button" role="option" id="sug-${k}" data-k="${k}"><span>${esc(it.s.name)}</span><small>${esc(OPNAME(it.s.op))}・${it.s.rts.length}系統</small></button>`;
    });
    sug.innerHTML = html;
    sug.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => pick(hit[+b.dataset.k]));
  }

q.oninput = search;
q.onfocus = () => { if (q.value.trim()) search(); };
qclear.onclick = () => { q.value = ""; qclear.hidden = true; showSug(false); act = -1; q.focus(); };
q.onkeydown = e => {

  if (e.key === "Escape") { e.preventDefault(); if (!sug.hidden) showSug(false); else if (q.value) { q.value = ""; qclear.hidden = true; } return; }
  if (sug.hidden || !hit.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); setAct((act + 1) % hit.length); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setAct((act - 1 + hit.length) % hit.length); }
  // ↑↓で選んだ候補があればそれを開く。何も選んでいない時は従来どおり「バス停・系統の先頭候補」を開く（バス停・系統の候補が1つも無い語の時だけ、先頭の場所）
  else if (e.key === "Enter") { e.preventDefault(); pick(act >= 0 ? hit[act] : (hit.find(h => h.t !== "p") || hit[0])); }
};
document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) showSug(false); });
const setPh = () => { q.placeholder = isMobile() ? "場所・バス停・系統" : "場所・バス停・系統を検索"; };   // 狭い画面では短く
setPh(); mqMobile.addEventListener("change", setPh);
home();
applySheet();
map.invalidateSize();
// ?at=<市町村コード> で開いた時は、その市町村のバス停の範囲へ地図を寄せる(県ページの市町村ボタン)。不明なコードは無視して既定の表示。
(() => { const at = new URLSearchParams(location.search).get("at"), mu = at && MUNI.find(m => m[0] === at);
  if (!mu) { if (isMobile()) { const z = map.getZoom(), pt = map.project(map.getCenter(), z).add([0, sheetPx("mid") / 2]); map.setView(map.unproject(pt, z), z, { animate: false }); } return; }   // スマホの既定の表示は、中心が標準のシートに隠れないよう、見える部分の中央へ
  map.fitBounds([[mu[2], mu[3]], [mu[4], mu[5]]], { paddingTopLeft: [24, 24], paddingBottomRight: [24, 24 + (isMobile() ? sheetPx("mid") : 0)], maxZoom: 14, animate: false });
  const h = pbody.querySelector("h2"); if (h) h.insertAdjacentHTML("afterend", `<p class="tip">福岡県ページから「${esc(mu[1])}」を開きました。地図はその市町村のバス停の範囲です。</p>`); })();
</script>
