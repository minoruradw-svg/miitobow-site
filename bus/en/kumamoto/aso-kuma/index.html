<style>
  :root {
    --bg: #f6f9f4; --surface: #ffffff; --surface-soft: #eef3ea;
    --ink: #1f2b20; --ink-soft: #55655a; --ink-faint: #5f6e5c;
    /* 文字・リンクは濃い緑（コントラスト確保）。ブランドの #6fae2f は枠・塗り・選択状態にだけ使う */
    --accent-dark: #3a5d22; --brand: #6fae2f; --brand-soft: rgba(111,174,47,.18);
    --border: #dde6d8; --sanko: #2f8a4e; --kumabus: #d9822b; --aso: #1a8a8a; --community: #9b4dca; --other: #5a7fa8;
    --hdr: 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12180f; --surface: #1b2317; --surface-soft: #212b1c;
      --ink: #eaf1e5; --ink-soft: #a7b8a2; --ink-faint: #8c9c88;
      --accent-dark: #b4e68f; --brand: #82c455; --brand-soft: rgba(130,196,85,.22);
      --border: #2b3625; --sanko: #5fc080; --kumabus: #f0a35e; --aso: #4fc3c3; --community: #c58be8; --other: #86a9d0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
  .head { font-family: "M PLUS Rounded 1c","Hiragino Sans",sans-serif; font-weight: 900; letter-spacing: .02em; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 1px; }

  /* ---- ヘッダー ---- */
  header { position: relative; z-index: 1300; min-height: var(--hdr); padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  header h1 { margin: 0; font-size: 18px; color: var(--accent-dark); white-space: nowrap; }
  .searchwrap { position: relative; flex: 1 1 260px; max-width: 460px; }
  #q { width: 100%; height: 42px; padding: 0 44px 0 14px; font-size: 16px; border: 2px solid var(--border); border-radius: 12px;
    background: var(--surface-soft); color: var(--ink); -webkit-appearance: none; appearance: none; }
  #q::-webkit-search-cancel-button { display: none; }
  #q:focus { border-color: var(--brand); outline: none; background: var(--surface); box-shadow: 0 0 0 3px var(--brand-soft); }
  #qclear { position: absolute; right: 2px; top: 0; width: 42px; height: 42px; border: 0; background: none; color: var(--ink-soft);
    font-size: 22px; line-height: 1; cursor: pointer; border-radius: 12px; }
  #qclear[hidden] { display: none; }
  #qclear:hover { color: var(--ink); background: var(--brand-soft); }
  #sug { position: absolute; z-index: 1400; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; max-height: min(60dvh, 440px); overflow: auto; box-shadow: 0 8px 28px rgba(0,0,0,.18);
    overscroll-behavior: contain; padding-bottom: 4px; }
  #sug[hidden] { display: none; }
  #sug .sh { position: sticky; top: 0; padding: 7px 14px 5px; font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--accent-dark);
    background: var(--surface-soft); border-bottom: 1px solid var(--border); }
  #sug button { display: flex; width: 100%; min-height: 48px; text-align: left; gap: 10px; padding: 10px 14px; background: none; border: 0;
    border-bottom: 1px solid var(--border); color: var(--ink); font-size: 15px; cursor: pointer; align-items: center; justify-content: space-between; }
  #sug button:hover { background: var(--brand-soft); }
  #sug button.act { background: var(--brand-soft); box-shadow: inset 4px 0 0 var(--brand); }
  #sug small { color: var(--ink-soft); font-size: 12px; flex: 0 1 46%; max-width: 50%; text-align: right; line-height: 1.4; }
  #sug button span { flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }
  #sug .empty { padding: 16px 14px; font-size: 14px; line-height: 1.7; color: var(--ink-soft); }
  #sug .empty b { color: var(--ink); }
  #sug span .en { display: block; flex: none; max-width: 100%; text-align: left; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  #sug .scats { display: flex; gap: 6px; padding: 8px 14px 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #sug .scats::-webkit-scrollbar { display: none; }
  #sug .scats .scat { flex: none; width: auto; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  #sug .scats .scat small { flex: none; max-width: none; font-weight: 400; color: var(--ink-soft); margin: 0; text-align: left; }
  #sug .scats .scat[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  #sug .more { color: var(--accent-dark); font-weight: 700; }
  .enname { margin: -2px 0 8px; font-size: 14px; color: var(--ink-soft); }
  .rt .enm { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  .chips { display: flex; gap: 6px; flex-wrap: nowrap; font-size: 13px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; min-width: 44px; padding: 0 12px; border-radius: 999px;
    border: 2px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; user-select: none; }
  .chip i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); font-weight: 700; }
  .chip[aria-pressed="false"] { color: var(--ink-faint); }
  .chip[aria-pressed="false"] i { opacity: .4; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .placepin span { display: block; width: 26px; height: 26px; margin: 3px; border-radius: 50% 50% 50% 0; background: var(--brand); border: 3px solid #1f2b20; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .placepin span::after { content: ""; position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .placetip { font-weight: 700; font-size: 13px; color: #1f2b20; background: #fff; border: 2px solid #1f2b20; border-radius: 8px; }
  .tgl { margin-left: auto; min-height: 40px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface);
    color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .tgl:hover { border-color: var(--brand); background: var(--brand-soft); }

  /* ---- 地図とパネル ---- */
  main { flex: 1; position: relative; min-height: 0; display: flex; --cover: 0px; }
  #map { flex: 1; min-width: 0; position: relative; }
  .leaflet-container { font-family: inherit; }
  .leaflet-bottom { bottom: var(--cover, 0px); }
  .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; }
  /* 地図の種類の切り替え(右上)。ズームボタンと同じく、地図の上は明るい色で統一 */
  .leaflet-top.leaflet-right { z-index: 1150; }   /* スマホでシートを最大にしても、メニューがシートの裏に隠れない(ヘッダー1300・検索候補1400より下) */
  .basectl { position: relative; }
  .basectl .bc-btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; padding: 0 10px; font: 700 14px/1 "Hiragino Sans","Yu Gothic",system-ui,sans-serif; white-space: nowrap; border: 2px solid rgba(0,0,0,.2); border-radius: 8px; background: #fff; color: #1f2b20; cursor: pointer; box-shadow: none; }
  .basectl .bc-btn:hover { background: #f4f4f4; }
  .basectl .bc-btn:focus-visible, .basectl .bc-opt:focus-visible { outline: 3px solid #6fae2f; outline-offset: 2px; }
  .bc-menu { position: absolute; right: 0; top: 50px; width: 246px; padding: 6px; border-radius: 12px; background: #fff; color: #1f2b20; border: 2px solid rgba(0,0,0,.2); box-shadow: 0 6px 20px rgba(0,0,0,.22); }
  .bc-menu[hidden] { display: none; }
  .bc-opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border: 0; border-radius: 8px; background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
  .bc-opt:hover { background: #eef3ea; }
  .bc-opt.on { background: rgba(111,174,47,.18); }
  .bc-opt b { display: block; font-size: 15px; }
  .bc-opt small { display: block; font-size: 12px; color: #55655a; line-height: 1.3; }
  .bc-ck { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #55655a; background: #fff; }
  .bc-opt.on .bc-ck { border-color: #3a5d22; background: radial-gradient(circle, #3a5d22 0 45%, #fff 50%); }
  #tilewarn { position: absolute; z-index: 1050; left: 8px; right: 8px; top: 62px; margin: 0 auto; width: max-content; max-width: min(100% - 16px, 520px); display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; border-radius: 12px; background: #fff4d6; color: #5a4300; border: 1px solid #e3c36a; font-size: 13px; line-height: 1.6; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  #tilewarn[hidden] { display: none; }
  #tilewarn button { flex: none; min-width: 44px; min-height: 44px; margin: -8px -6px -8px 0; border: 0; background: none; color: inherit; font-size: 20px; cursor: pointer; }

  #panel { width: clamp(320px, 28vw, 400px); display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); min-height: 0; }
  @media (min-width: 1024px) { #panel { width: clamp(360px, 26vw, 400px); } }
  @media (min-width: 768px) { main.pclosed #panel { display: none; } }
  .sheet-top { display: none; }
  .pbody { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  .pbody h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
  .pbody p { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); }
  .meta .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-soft); color: var(--ink); }
  .meta .pill i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .meta b { color: var(--ink); }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin: -4px 0 8px -4px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface);
    color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back:hover { border-color: var(--brand); background: var(--brand-soft); }
  /* ホームへ一発で戻るボタン: PCはパネル内の「もどる」の隣、スマホはシート上部の右 */
  .back, .homebtn { vertical-align: top; }   /* 『もどる』と『ホーム』の上端をそろえる(overflow:hiddenの『もどる』は、基準線が下に来て、ホームより低く並んでいた) */
  .homebtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: -4px 0 8px 8px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .homebtn:hover { border-color: var(--brand); background: var(--brand-soft); }
  .homebtn svg { flex: none; }
  .hometop { display: none; }
  .nw { white-space: nowrap; }
  #pbody h2:focus { outline: none; }
  .lh { margin: 14px 0 4px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .tip { font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin: 0 0 8px; }
  .rt { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: 44px; text-align: left; margin: 0 0 6px; padding: 8px 12px; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--border); background: var(--surface-soft); color: var(--ink); cursor: pointer; }
  .rt:hover { border-color: var(--brand); background: var(--brand-soft); }
  .rt small { color: var(--ink-soft); font-size: 12px; flex: none; }
  .grp { margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .grp i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .rbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 5px; margin: 6px 0 8px; padding: 6px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  .rbar button { flex: 1 1 0; min-width: 44px; min-height: 44px; padding: 0 4px; border: 2px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  @media (hover: hover) { .rbar button:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); } }   /* 指で押した後に「押されたまま」に見えないよう、カーソルのある端末だけ */
  .rbar button:disabled { opacity: .4; cursor: default; }
  .rbar button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); }
  .rbar button[aria-pressed="true"]::before { content: "✓ "; font-weight: 800; }   /* オンの目印(色だけに頼らない) */
  .rbar #rPos { flex: none; min-width: 72px; text-align: center; font-size: 13px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stnum { width: auto !important; min-width: 16px; padding: 0 4px; border: 1.5px solid #1f2b20; border-radius: 8px; background: rgba(255,255,255,.94); color: #1f2b20; font: 700 11px/13px system-ui, sans-serif; text-align: center; pointer-events: none; box-sizing: border-box; }
  .stoplist { list-style: none; counter-reset: st; padding: 0; margin: 0; }
  .stoplist li { counter-increment: st; display: flex; align-items: center; }
  .stoplist li::before { content: counter(st); flex: none; width: 2.4em; text-align: right; padding-right: .7em; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .stoplist button { display: block; flex: 1; min-height: 44px; text-align: left; padding: 6px 10px; font-size: 14px; line-height: 1.4; color: var(--ink); background: none; border: 0; border-left: 4px solid transparent; border-radius: 6px; cursor: pointer; }
  .stoplist button:hover, .stoplist button.hl { background: var(--brand-soft); }
  .stoplist button.cur { background: var(--brand-soft); border-left-color: var(--brand); font-weight: 700; }
  .warn { flex: none; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; line-height: 1.5; color: var(--ink); background: #fff7e0; border-top: 1px solid #ecd9a0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .warn { background: #2b2610; border-top-color: #4b4217; } }
  .warn a { color: var(--accent-dark); font-weight: 700; }
  details.note { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 4px; font-size: 12px; line-height: 1.7; color: var(--ink-soft); }
  details.note summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; color: var(--accent-dark); }
  details.note a { color: var(--accent-dark); }

  /* ---- スマホ：ボトムシート（ヘッダー1行化・シート内を詰める）---- */
  @media (max-width: 767px) {
    header { flex-wrap: nowrap; gap: 6px; padding: 6px 10px; padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
    header h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .tgl { display: none; }
    .searchwrap { order: 0; flex: 1 1 auto; min-width: 0; max-width: none; }
    #q { height: 44px; padding-left: 12px; }
    #q:placeholder-shown { padding-right: 8px; }
    #q::placeholder { font-size: 14px; }
    #qclear { width: 44px; height: 44px; }
    .chips { flex: none; margin-left: 0; gap: 4px; }
    .chip { min-height: 44px; min-width: 44px; padding: 0 7px; gap: 3px; font-size: 13px; }
    .chip .long { display: none; }
    #panel { position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; width: auto; height: var(--sh, 40%); border-left: 0; border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.22); transition: height .22s ease; overflow: hidden; }
    #panel.drag { transition: none; }
    .sheet-top { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; flex: none; width: 100%; min-height: 44px; padding: 6px 16px 2px;
      border: 0; background: none; color: var(--ink); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 18px 18px 0 0; }
    .sheet-top .bar { width: 44px; height: 5px; border-radius: 3px; background: var(--brand); }
    .sheet-top #psum { max-width: 100%; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #panel.min .pbody, #panel.min .warn { visibility: hidden; }
    #panel.min .warn { display: none; }
    .pbody { padding: 0 16px 10px; }
    .back { float: right; margin: 0 0 0 8px; padding: 0 12px; min-height: 44px; max-width: 58%; }
    .homebtn { display: none; }
    .hometop { position: absolute; z-index: 3; top: 0; right: 6px; width: 60px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 2px 0 0; border: 0; border-radius: 12px; background: none; color: var(--ink); cursor: pointer; font-size: 10.5px; font-weight: 700; line-height: 1.1; }
    .hometop[hidden] { display: none; }
    .hometop:active { background: var(--brand-soft); }
    #panel.hashome .sheet-top #psum { max-width: calc(100% - 136px); }
    #sug { position: fixed; left: 8px; right: 8px; top: 64px; }   /* 検索欄は狭いので、候補は画面幅いっぱいに出す(topはJSで補正) */
    #sug button { flex-wrap: wrap; row-gap: 0; }
    #sug small { flex: 1 1 100%; max-width: 100%; text-align: left; }
    .pbody h2 { font-size: 18px; margin: 6px 0 4px; }
    .meta { margin-bottom: 6px; }
    .lh { margin-top: 8px; }
    .grp { margin: 6px 0 4px; }
    .rt { margin-bottom: 4px; }
    .warn { white-space: nowrap; overflow: hidden; padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); font-size: clamp(10.5px, 3.1vw, 12px); }

// 標準段は46%。画面が低い端末(375×667など)は地図が狭くなりすぎない範囲で50%に
const shRatio = st => { const H = mainEl.clientHeight; return st === "min" ? .13 : st === "max" ? .88 : H < 640 ? .50 : .46; };
let sheetState = "mid";
const sheetPx = st => { const H = mainEl.clientHeight; return st === "min" ? Math.max(72, Math.round(H * shRatio(st))) : Math.round(H * shRatio(st)); };
const cover = () => isMobile() ? sheetPx(sheetState) : 0;      // 地図の下側がシートで隠れるpx
function applySheet() {
  if (!isMobile()) { panel.style.height = ""; mainEl.style.setProperty("--cover", "0px"); panel.classList.remove("min"); return; }
  const h = sheetPx(sheetState);
  panel.style.height = h + "px"; mainEl.style.setProperty("--cover", h + "px");
  panel.classList.toggle("min", sheetState === "min");
  grip.setAttribute("aria-expanded", String(sheetState !== "min"));
}
const setSheet = st => { sheetState = st; applySheet(); };
// 地図の見えている部分（シートの上側）の中央に、その地点が来るようにする
function focusTo(ll, z) {
  const zz = z == null ? map.getZoom() : z, p = map.project(ll, zz); p.y += cover() / 2;
  map.setView(map.unproject(p, zz), zz, { animate: !RM });
}
function ensureVisible(ll) {
  const c = cover(); if (!c) return;
  const size = map.getSize(), pt = map.latLngToContainerPoint(ll);
  if (pt.y > size.y - c - 44 || pt.y < 44 || pt.x < 30 || pt.x > size.x - 30) focusTo(ll);
}
// シートのドラッグ（取っ手だけがスワイプを受ける。地図とパネル内のスクロールには干渉しない）
let drag = null;
grip.addEventListener("pointerdown", e => {
  if (!isMobile() || (e.pointerType === "mouse" && e.button !== 0)) return;
  drag = { y0: e.clientY, h0: panel.getBoundingClientRect().height, moved: false, last: e.clientY, lt: e.timeStamp, v: 0 };
  grip.setPointerCapture(e.pointerId); panel.classList.add("drag");
});
grip.addEventListener("pointermove", e => {
  if (!drag) return;
  const dy = drag.y0 - e.clientY; if (Math.abs(dy) > 6) drag.moved = true;
  if (!drag.moved) return;
  const h = Math.max(sheetPx("min"), Math.min(sheetPx("max"), drag.h0 + dy));
  panel.style.height = h + "px"; mainEl.style.setProperty("--cover", h + "px"); panel.classList.remove("min");
  const dt = e.timeStamp - drag.lt; if (dt > 0) drag.v = (drag.last - e.clientY) / dt; drag.last = e.clientY; drag.lt = e.timeStamp;
});
function endDrag(e) {
  if (!drag) return; const d = drag; drag = null; panel.classList.remove("drag");
  if (e.type === "pointercancel" && !d.moved) { applySheet(); return; }
  if (!d.moved) { setSheet(sheetState === "min" ? "mid" : sheetState === "mid" ? "max" : "mid"); return; }
  const h = panel.getBoundingClientRect().height, px = SORDER.map(sheetPx);
  let k = px.reduce((b, p, i) => Math.abs(p - h) < Math.abs(px[b] - h) ? i : b, 0);
  if (d.v > .45) k = Math.max(k, px.findIndex(p => p > h + 4) < 0 ? 2 : px.findIndex(p => p > h + 4));
  else if (d.v < -.45) { const lo = px.map((p, i) => p < h - 4 ? i : -1).filter(i => i >= 0); k = Math.min(k, lo.length ? lo[lo.length - 1] : 0); }
  setSheet(SORDER[k]);
}
grip.addEventListener("pointerup", endDrag); grip.addEventListener("pointercancel", endDrag);
grip.addEventListener("click", e => { if (e.detail === 0) setSheet(sheetState === "min" ? "mid" : sheetState === "mid" ? "max" : "mid"); });   // キーボード(Enter/Space)
grip.addEventListener("keydown", e => {
  const k = SORDER.indexOf(sheetState);
  if (e.key === "ArrowUp") { e.preventDefault(); setSheet(SORDER[Math.min(2, k + 1)]); }
  else if (e.key === "ArrowDown") { e.preventDefault(); setSheet(SORDER[Math.max(0, k - 1)]); }
});
// PC・タブレットのパネル開閉（マーカーは作り直さず、地図の大きさだけ取り直す）
function openPanel(v) {
  mainEl.classList.toggle("pclosed", !v);
  tgl.querySelector(".tl").textContent = v ? "Close panel" : "Open panel"; tgl.querySelector(".ta").textContent = v ? "▶" : "◀";
  tgl.setAttribute("aria-label", v ? "Close panel" : "Open panel"); tgl.setAttribute("aria-expanded", String(v));
  map.invalidateSize();
}
tgl.onclick = () => openPanel(mainEl.classList.contains("pclosed"));
// 画面サイズが変わっても、選択・検索の状態は保ったまま配置だけ取り直す
let rzT = 0;
new ResizeObserver(() => {
  map.invalidateSize(); applySheet();
  clearTimeout(rzT); rzT = setTimeout(() => { if (curStops[0] && !hoverList.length) ensureVisible(L.latLng(curStops[0].lat, curStops[0].lon)); }, 200);
}).observe(mainEl);

const on = Object.fromEntries(GORDER.map(g => [g, true]));
let selRoute = null, lastStop = null, lastPlace = null, curStops = [], curRings = [], placePin = null;
const colorOf = g => css(g);
const isSel = s => !selRoute || selRoute.set.has(s);
const baseR = () => { const z = map.getZoom(); return z <= 12 ? 3 : z <= 14 ? 4.5 : z <= 15 ? 5.5 : 7; };
const markers = stops.map(s => {
  const m = L.circleMarker([s.lat, s.lon], { radius: 5, weight: 2, color: "#fff", fillColor: colorOf(s.g), fillOpacity: .95 });
  m.on("click", () => { if (isSel(s)) { showStop(s); ensureVisible(L.latLng(s.lat, s.lon)); } });   // 薄くした点は押せない（誤タップ防止）
  m.bindTooltip(tnm(s), { direction: "top", offset: [0, -4] });
  m.on("tooltipopen", () => { if (!isSel(s)) m.closeTooltip(); });
  m.on("mouseover", () => { if (isSel(s)) hoverOn([s], true); });
  m.on("mouseout", () => { if (!touchOnly()) hoverOff(); });   // 指で押した時に出る疑似mouseoutで、選択中の輪を消さない
  s.m = m; return m;
});

// カーソルを合わせたバス停を強調（大きな黄色の輪）。リストの名前に合わせた時も、地図の点に合わせた時も同じ見え方
let hoverRings = [], hoverList = [];
function hoverOn(list, fromMap) {
  hoverOff(); hoverList = list.slice();
  list.forEach(s => {
    if (!s.m._map) return;
    hoverRings.push(L.circleMarker([s.lat, s.lon], { radius: baseR() + 13, color: "#1f2b20", weight: 4, fillColor: "#ffd400", fillOpacity: .6, interactive: false }).addTo(map));
    s.m.bringToFront();
  });
  if (list[0] && list[0].m._map) list[0].m.openTooltip();
  const li = pbody.querySelector(`.stoplist button[data-n="${CSS.escape(list[0].name)}"]`);
  if (li && fromMap) li.classList.add("hl");
}
function hoverOff() {
  hoverRings.forEach(r => r.remove()); hoverRings = [];
  hoverList.forEach(s => s.m.closeTooltip()); hoverList = [];
  pbody.querySelectorAll(".stoplist button.hl").forEach(b => b.classList.remove("hl"));
}

function styleOne(s, r0) {
  const inSel = isSel(s);
  // 系統を選んでいる間は、その系統が通るバス停を事業者フィルタに関係なく出す
  const vis = on[s.g] || (selRoute && inSel);
  if (!vis) { if (s.m._map) s.m.remove(); return; }
  if (!s.m._map) s.m.addTo(map);
  const cur = curStops.includes(s);
  s.m.setStyle({ fillColor: colorOf(s.g), fillOpacity: inSel ? .95 : .12, opacity: inSel ? 1 : .15,
    radius: cur ? r0 + 4 : selRoute && inSel ? r0 + 2 : r0, weight: cur ? 3 : selRoute && inSel ? 2.5 : 2 });
  if ((selRoute && inSel) || cur) s.m.bringToFront();
}
// 系統を選んでいる間、地図の点に『推定順の番号』を出す（切り替え可・この端末に覚える）。低ズームでは、1・5の倍数・最後だけ
const touchOnly = () => isMobile() || matchMedia("(hover: none)").matches;   // カーソルを合わせられない端末(スマホ・タブレット)
let numOn = true; try { numOn = localStorage.getItem("busmap.num") !== "0"; } catch (e) {}
const numLayer = L.layerGroup().addTo(map);
function drawNums() {
  numLayer.clearLayers();
  if (!selRoute || !numOn) return;
  const z = map.getZoom(), n = selRoute.order.length, pos = new Map(selRoute.order.map((nm, i) => [nm, i + 1]));
  const sel = curStops[0] ? curStops[0].name : null, items = [];
  selRoute.stops.forEach(s => { const k = pos.get(s.name); if (!k) return;
    const pri = s.name === sel ? 0 : (k === 1 || k === n) ? 1 : k % 5 === 0 ? 2 : 3;
    if (z < 13 && pri > 2) return;
    items.push({ s, k, pri, p: map.latLngToContainerPoint([s.lat, s.lon]) }); });
  items.sort((a, b) => a.pri - b.pri || a.k - b.k);
  const kept = [];   // 画面上で重なる番号は、優先度の高い方だけ残す(選択中・最初/最後・5の倍数 → その他)
  items.forEach(it => { if (kept.some(o => Math.abs(o.p.x - it.p.x) < 26 && Math.abs(o.p.y - it.p.y) < 18)) return; kept.push(it);
    L.marker([it.s.lat, it.s.lon], { icon: L.divIcon({ className: "stnum", html: String(it.k), iconSize: [22, 16], iconAnchor: [-4, 21] }), interactive: false, keyboard: false, zIndexOffset: 400 }).addTo(numLayer); });
}
function paint() { const r0 = baseR(); stops.forEach(s => styleOne(s, r0)); drawRings(); drawNums(); }
// 選択中のバス停の外周リング（白い縁取り＋濃い輪＋ブランドグリーンの塗り）
function drawRings() {
  curRings.forEach(r => r.remove()); curRings = [];
  curStops.forEach(s => { if (!s.m._map) return;
    const R = baseR() + 9;
    curRings.push(L.circleMarker([s.lat, s.lon], { radius: R + 2, color: "#fff", weight: 7, fill: false, interactive: false }).addTo(map));
    curRings.push(L.circleMarker([s.lat, s.lon], { radius: R, color: "#1f2b20", weight: 3, fillColor: "#6fae2f", fillOpacity: .28, interactive: false }).addTo(map));
    s.m.bringToFront(); });
}
map.on("zoomend", paint);
// ---- この地図の範囲(設計 D-2)：ズーム12以下の時だけ、データの範囲を破線の長方形で示す(これより外の停留所・系統は載っていない) ----
const EXT = [32.15, 130.72, 33.2, 131.32];   // [緯度小, 経度小, 緯度大, 経度大]
const extRect = L.rectangle([[EXT[0], EXT[1]], [EXT[2], EXT[3]]], { interactive: false, dashArray: "6 6", weight: 2, opacity: .7, fill: false });
const extTip = L.circleMarker([EXT[2], (EXT[1] + EXT[3]) / 2], { radius: 0, opacity: 0, fill: false, interactive: false }).bindTooltip("Map coverage", { permanent: true, direction: "bottom", className: "extlbl", interactive: false });
const extLayer = L.layerGroup([extRect, extTip]);
const syncExtent = () => { const on = map.getZoom() <= 12; if (on) extRect.setStyle({ color: css("ink") }); if (on && !map.hasLayer(extLayer)) extLayer.addTo(map); else if (!on && map.hasLayer(extLayer)) map.removeLayer(extLayer); };
map.on("zoomend", syncExtent); syncExtent(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncExtent);
// 選択中のバス停（地図・一覧で共通）を差し替える。点の再描画は変わった分だけ
function setCur(list, scroll = true) {
  const old = curStops; curStops = list || [];
  const r0 = baseR(); old.concat(curStops).forEach(s => styleOne(s, r0)); drawRings();
  pbody.querySelectorAll(".stoplist button.cur").forEach(b => b.classList.remove("cur"));
  if (curStops[0]) { const b = pbody.querySelector(`.stoplist button[data-n="${CSS.escape(curStops[0].name)}"]`); if (b) { b.classList.add("cur"); if (scroll) b.scrollIntoView({ block: "nearest" }); } }
}

const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NOTE = `<details class="note"><summary>About this page · Sources · Disclaimer</summary>

• Municipalities in this map (18): Takamori Town, Aso City, Minamiaso Village, Misato Town, Yamato Town, Oguni Town, Sagara Village, Minamioguni Town, Kosa Town, Nishiki Town, Mizukami Village, Asagiri Town, Nishihara Village, Taragi Town, Itsuki Village, Ubuyama Village, Yunomae Town, Yamae Village. <br>

${HASSPOT ? `• Locations of sights and shops: approximate addresses made by cross-checking GSI Japan, OSM and Wikipedia (as of 2026-11-02). Shops may close, move or suspend business. This page is not affiliated with any listed shop or facility and is not advertising. “Popular with visitors” is an unofficial guide based on sources such as Honichi Lab rankings and listings in English travel guides.<br>` : ""}
• Map: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">GSI Japan map tiles (Standard, Pale, Seamless latest aerial photos)</a>. Aerial photo dates vary by area and may not show the current situation.<br>
• Map display: <a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a></details>`;
const opPill = g => `<span class="pill"><i style="background:var(--${g})"></i>`;
const HOMEICON = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-6h4v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function goHome() { home(); if (isMobile()) setSheet("mid"); }   // どの画面からでも、一発でホームへ(スマホは地図が見える高さに戻す)
homeTop.onclick = goHome;
function render(html, sum) {
  const ae = document.activeElement, fromPanel = !ae || ae === document.body || pbody.contains(ae);
  pbody.innerHTML = html; psum.textContent = sum; pbody.scrollTop = 0;
  const bk = pbody.querySelector(".back");
  if (bk) { const hm = document.createElement("button"); hm.type = "button"; hm.className = "homebtn"; hm.setAttribute("aria-label", "Back to home (start screen)"); hm.innerHTML = HOMEICON + "Home"; hm.onclick = goHome; bk.insertAdjacentElement("afterend", hm); }   // PC用（スマホはシート上部のボタン）
  homeTop.hidden = !bk; panel.classList.toggle("hashome", !!bk);
  const h = pbody.querySelector("h2"); if (h && fromPanel) { h.tabIndex = -1; h.focus({ preventScroll: true }); }   // 画面が替わったことを、キーボード・読み上げの利用者にも伝える
}

  document.getElementById("bArea").onclick = showAreaIndex; document.getElementById("bStn").onclick = showLineIndex; const bs = document.getElementById("bSpot"); if (bs) bs.onclick = showSpotIndex;

function routeBtn(r) {
  return `<button class="rt" type="button" data-r="${r.i}"><span>${rnm(r)}</span><small>${r.n} ${P(r.n, "stop", "stops")}</small></button>`;
}
function groupedRoutes(rs) {
  let out = "", cur = "";
  rs.slice().sort(routeCmp).forEach(r => {
    if (r.g !== cur) { cur = r.g; out += `<div class="grp"><i style="background:var(--${r.g})"></i>${GLABEL[r.g]}</div>`; }
    out += routeBtn(r);
  });
  return out;
}
function showStop(s, opt) {
  hoverOff(); selRoute = null; lastStop = s; openPanel(true);
  if (isMobile()) setSheet("mid");
  setCur([s]);
  if (opt && opt.center) focusTo(L.latLng(s.lat, s.lon), opt.zoom);
  const rs = s.rts.map(i => routes[i]);
  render(`<button class="back" id="bk" type="button">← Back</button><h2 class="head">${nm(s)}</h2>
  <div class="meta">${opPill(s.g)}${esc(OPNAME(s.op))}</span><span><b>${rs.length}</b> ${P(rs.length, "route", "routes")}</span></div>
  ${rs.length ? `<div class="lh">Routes serving this stop</div>` + groupedRoutes(rs) : `<p>No route information</p>`}${NOTE}`,
  `${s.en} · ${rs.length} ${P(rs.length, "route", "routes")}`);
  paint();   // 系統表示から戻った時の薄表示を解除
  bind();
  if (lastPlace) { const bk = document.getElementById("bk"), pl = lastPlace; bk.textContent = `← Back to ${PE(pl)}`; bk.onclick = () => showPlace(pl, { noMove: true }); }
}

// ---- 場所（駅・地名・施設）：地図をその周辺へ動かし、近くのバス停を一覧する。系統一覧は自動では開かない ----

  chips.appendChild(c); chipEls[g] = c;

function syncChips() { GORDER.forEach(g => chipEls[g].setAttribute("aria-pressed", on[g])); }

// 検索（Enter／↑↓／Escに対応。判定ロジックは従来どおり）
const q = document.getElementById("q"), sug = document.getElementById("sug"), qclear = document.getElementById("qclear");
const kana = t => t.normalize("NFKC").toLowerCase();
const items = [...routes.map(r => ({ t: "r", r, key: kana(r.name + " " + D.ops[r.op]) + "|" + kana(routeLabel(r) + " " + OPNAME(r.op)) + "|" + pnorm(routeLabel(r)) })),
  ...stops.map(s => ({ t: "s", s, key: kana(s.name) + "|" + pnorm(s.en) + "|" + pnorm(s.en.replace(/\bSta\./g, "Station")) }))];
let hit = [], act = -1;
const showSug = v => { sug.hidden = !v; q.setAttribute("aria-expanded", String(v)); if (!v) q.removeAttribute("aria-activedescendant"); };
function pick(it) {
  showSug(false); q.value = ""; qclear.hidden = true; act = -1; placeBack = null;
  if (it.t === "idx") { showSpotIndex(); return; }
  if (it.t === "p") { showPlace(it.p); return; }
  lastPlace = null; clearPin();     // 場所から離れて、検索で別のバス停・系統を選んだ時
  it.t === "r" ? showRoute(it.r) : (showStop(it.s, { center: true, zoom: 16 }), ensureVisible(L.latLng(it.s.lat, it.s.lon)));
}
function setAct(k) {
  act = k; if (k >= 0) q.setAttribute("aria-activedescendant", "sug-" + k);
  sug.querySelectorAll("button[data-k]").forEach((b, i) => { b.classList.toggle("act", i === act); b.setAttribute("aria-selected", i === act); if (i === act) b.scrollIntoView({ block: "nearest" }); });
}
function search() {
  const raw = q.value.trim(), v = kana(raw); act = -1; qclear.hidden = !q.value;
  if (!v) { if (HASSPOT && document.activeElement === q) showReco(); else showSug(false); return; }
  sug.dataset.mode = "";
  hit = (pv0 => { const h = items.filter(it => it.key.includes(v) || (pv0.length > 1 && it.key.includes(pv0))); const opOnly = it => it.t === "r" && !(kana(it.r.name + " " + routeLabel(it.r)).includes(v) || (pv0.length > 1 && pnorm(routeLabel(it.r)).includes(pv0))); return h.some(it => it.t === "s") && h.filter(it => it.t === "r").length > 20 ? h.filter(it => !opOnly(it)) : h; })(pnorm(raw));
  hit.sort((a, b) => (a.t === b.t ? 0 : a.t === "r" ? -1 : 1) || kpre(a, v, pnorm(raw)) - kpre(b, v, pnorm(raw)) || (a.t === "s" && b.t === "s" ? a.s.en.length - b.s.en.length : 0));
  hit = hit.slice(0, 40);
  // 場所（駅・地名・施設）は別の候補群として先頭に追加。既存のバス停・系統の判定と並びは変えない
  const pv = pnorm(raw);
  const ph = placeItems.filter(it => it.key.includes(pv)).map(it => ({ it, sc: it.name === pv ? 0 : it.name.startsWith(pv) ? 1 : 2 }))
    .sort((a, b) => a.sc - b.sc || PTYPE_ORDER.indexOf(a.it.p.type) - PTYPE_ORDER.indexOf(b.it.p.type) || a.it.p.name.length - b.it.p.name.length || areaRank(a.it.p.area) - areaRank(b.it.p.area)).slice(0, 8).map(x => x.it);
  hit = ph.concat(hit);
  if (!hit.length) {
    sug.innerHTML = `<div class="empty">No places, stops or routes match <b>“${esc(raw)}”</b>.<br>Try:<br>• a station, town, place or facility name (e.g. Aso Station, Aso Shrine, Kusasenri)<br>• part of a stop name (e.g. Aso)<br>• a route number (e.g. Kurokawa)${HASSPOT ? `<br>Search in English or Japanese, e.g. “${esc(SPOT_EN_HINT)}”` : ""}</div>`;
  } else {
    let html = "", cur = "";
    hit.forEach((it, k) => {
      if (it.t !== cur) { cur = it.t; html += `<div class="sh" role="presentation">${it.t === "p" ? "Places" : it.t === "r" ? "Routes" : "Bus stops"}</div>`; }
      html += it.t === "p"
        ? `<button type="button" role="option" id="sug-${k}" data-k="${k}"><span>${esc(it.p.pe)}<small class="en ja" lang="ja">${esc(it.p.name)}</small></span><small>${esc(placeSub(it.p))}</small></button>`
        : it.t === "r"
        ? `<button type="button" role="option" id="sug-${k}" data-k="${k}"><span>${rnm(it.r)}</span><small>${esc(OPNAME(it.r.op))} · ${it.r.n} ${P(it.r.n, "stop", "stops")}</small></button>`
        : `<button type="button" role="option" id="sug-${k}" data-k="${k}"><span>${nm(it.s)}</span><small>${esc(OPNAME(it.s.op))} · ${it.s.rts.length} ${P(it.s.rts.length, "route", "routes")}</small></button>`;
    });
    sug.innerHTML = html;
    sug.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => pick(hit[+b.dataset.k]));
  }
  if (isMobile()) sug.style.top = Math.round(document.querySelector("header").getBoundingClientRect().bottom + 4) + "px";
  showSug(true);
}
q.oninput = search;
q.onfocus = () => { if (q.value.trim() || HASSPOT) search(); };
qclear.onclick = () => { q.value = ""; qclear.hidden = true; showSug(false); act = -1; q.focus(); };
q.onkeydown = e => {
  if (e.isComposing || e.keyCode === 229) return;   // 日本語入力の変換確定のEnterでは候補を開かない
  if (e.key === "Escape") { e.preventDefault(); if (!sug.hidden) showSug(false); else if (q.value) { q.value = ""; qclear.hidden = true; } return; }
  if (sug.hidden || !hit.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); setAct((act + 1) % hit.length); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setAct((act - 1 + hit.length) % hit.length); }
  // ↑↓で選んだ候補があればそれを開く。何も選んでいない時は従来どおり「バス停・系統の先頭候補」を開く（バス停・系統の候補が1つも無い語の時だけ、先頭の場所）
  else if (e.key === "Enter") { e.preventDefault(); pick(act >= 0 ? hit[act] : (hit.find(h => h.t !== "p") || hit[0])); }
};
document.addEventListener("click", e => { if (e.target.isConnected && !e.target.closest(".searchwrap")) showSug(false); });
const setPh = () => { q.placeholder = HASSPOT ? (isMobile() ? "Search places & stops" : "Search places, stops, routes") : isMobile() ? "Search places & stops" : "Search places, stops, routes"; };   // 狭い画面では短く
setPh(); mqMobile.addEventListener("change", setPh);
home();
applySheet();
map.invalidateSize();
// ?at=<市町村コード> で開いた時は、その市町村のバス停の範囲へ地図を寄せる(県ページの市町村ボタン)。不明なコードは無視して既定の表示。
(() => { const at = new URLSearchParams(location.search).get("at"), mu = at && MUNI.find(m => m[0] === at);
  if (!mu) { if (isMobile()) { const z = map.getZoom(), pt = map.project(map.getCenter(), z).add([0, sheetPx("mid") / 2]); map.setView(map.unproject(pt, z), z, { animate: false }); } return; }   // スマホの既定の表示は、中心が標準のシートに隠れないよう、見える部分の中央へ
  map.fitBounds([[mu[2], mu[3]], [mu[4], mu[5]]], { paddingTopLeft: [24, 24], paddingBottomRight: [24, 24 + (isMobile() ? sheetPx("mid") : 0)], maxZoom: 14, animate: false });
  const h = pbody.querySelector("h2"); if (h) h.insertAdjacentHTML("afterend", `<p class="tip">Opened “${esc(mu[1])}” from the Kumamoto page. The map shows the area of its bus stops.</p>`); })();
// 言語の切り替えボタンは、今の ?at= などを引き継ぐ
document.querySelectorAll("a.lang").forEach(a => { a.href += location.search; });
// 見出し(地域名＋Bus Map)が収まらない狭い画面では「Bus Map」を省く
// それでも収まらない時は、地域名を短い名前(en.short)にする(2026-11-01・Okinawa Main Island 等)
const fitH1 = () => { const h = document.querySelector("header h1"); if (!h) return; const n = h.querySelector(".h1n"); if (n) { n.dataset.full = n.dataset.full || n.textContent; n.textContent = n.dataset.full; } h.classList.remove("cut"); if (h.scrollWidth > h.clientWidth + 1) { h.classList.add("cut"); if (n && h.scrollWidth > h.clientWidth + 1) n.textContent = n.dataset.short; } };
fitH1(); addEventListener("resize", fitH1);
</script>
