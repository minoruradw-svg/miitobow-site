const GROUP = i => { const n = D.ops[i]; return n.startsWith("西鉄") ? "nishitetsu" : n === "北九州市" ? "city" : "other"; };
const GLABEL = { nishitetsu: "西鉄バス", city: "北九州市（おでかけ交通など）", other: "その他の事業者" };
const GSHORT = { nishitetsu: "西鉄", city: "市", other: "他" };
const GORDER = ["nishitetsu", "city", "other"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
const stops = D.stops.map((s, i) => ({ i, name: s[0], lat: s[1], lon: s[2], op: s[3], rts: s[4], g: GROUP(s[3]) }));
const routes = D.routes.map((r, i) => ({ i, op: r[0], name: r[1], stops: [], g: GROUP(r[0]) }));
stops.forEach(s => s.rts.forEach(r => routes[r].stops.push(s)));
routes.forEach(r => { r.names = [...new Set(r.stops.map(s => s.name))]; r.n = r.names.length; });
const routeLabel = r => r.name;
const routeNum = r => { const m = r.name.match(/\d+/); return m ? +m[0] : 9999; };
const routeCmp = (a, b) => GORDER.indexOf(a.g) - GORDER.indexOf(b.g) || (a.g === "nishitetsu" ? routeNum(a) - routeNum(b) : 0) || a.name.localeCompare(b.name, "ja");

const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([33.8636, 130.7118], 14);

new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));

const on = { nishitetsu: true, city: true, other: true };
let selRoute = null, lastStop = null, focusRing = null;
const colorOf = g => css(g);
const isSel = s => !selRoute || selRoute.stops.includes(s);
const baseR = () => { const z = map.getZoom(); return z <= 12 ? 3 : z <= 14 ? 4.5 : z <= 15 ? 5.5 : 7; };
const markers = stops.map(s => {
  const m = L.circleMarker([s.lat, s.lon], { radius: 5, weight: 2, color: "#fff", fillColor: colorOf(s.g), fillOpacity: .95 });
  m.on("click", () => { if (isSel(s)) showStop(s); });   // 薄くした点は押せない（誤タップ防止）
  m.bindTooltip(s.name, { direction: "top", offset: [0, -4] });
  m.on("tooltipopen", () => { if (!isSel(s)) m.closeTooltip(); });
  m.on("mouseover", () => { if (isSel(s)) hoverOn([s], true); });
  m.on("mouseout", () => hoverOff());
  s.m = m; return m;
});

// カーソルを合わせたバス停を強調（大きな黄色の輪）。リストの名前に合わせた時も、地図の点に合わせた時も同じ見え方
let hoverRings = [], hoverList = [];
function hoverOn(list, fromMap) {
  hoverOff(); hoverList = list.slice();
  list.forEach(s => {
    if (!s.m._map) return;
    hoverRings.push(L.circleMarker([s.lat, s.lon], { radius: baseR() + 13, color: "#1f2b20", weight: 4, fillColor: "#ffd400", fillOpacity: .6, interactive: false }).addTo(map));
    s.m.bringToFront();
  });
  if (list[0] && list[0].m._map) list[0].m.openTooltip();
  const li = panel.querySelector(`.stoplist button[data-n="${CSS.escape(list[0].name)}"]`);
  if (li && fromMap) li.classList.add("hl");
}
function hoverOff() {
  hoverRings.forEach(r => r.remove()); hoverRings = [];
  hoverList.forEach(s => s.m.closeTooltip()); hoverList = [];
  panel.querySelectorAll(".stoplist button.hl").forEach(b => b.classList.remove("hl"));
}

function paint() {
  const r0 = baseR();
  stops.forEach(s => {
    const inSel = isSel(s);
    // 系統を選んでいる間は、その系統が通るバス停を事業者フィルタに関係なく出す
    const vis = on[s.g] || (selRoute && inSel);
    if (!vis) { s.m.remove(); return; }
    if (!s.m._map) s.m.addTo(map);
    s.m.setStyle({ fillColor: colorOf(s.g), fillOpacity: inSel ? .95 : .12, opacity: inSel ? 1 : .15,
      radius: selRoute && inSel ? r0 + 2 : r0, weight: selRoute && inSel ? 2.5 : 2 });
    if (selRoute && inSel) s.m.bringToFront();
  });
}
map.on("zoomend", paint);
function setRing(s) {
  if (focusRing) { focusRing.remove(); focusRing = null; }
  if (s) focusRing = L.circleMarker([s.lat, s.lon], { radius: 13, color: "#1f2b20", weight: 3, fill: false, interactive: false }).addTo(map);
}

・バス停の並び順・時刻・運賃は含みません（元データに順番が無いため、系統は「通るバス停を光らせる」表示です）。系統によっては一部のバス停しか載っていません。<br>
<b>出典</b><br>
・バス停・系統：<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-P11-2022.html" target="_blank" rel="noopener">国土交通省 国土数値情報（バス停留所データ・令和4年度・CC BY 4.0）</a>を加工して作成（2022年度時点）<br>
・地図：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院 地理院タイル（標準地図）</a><br>
・地図表示：<a href="https://leafletjs.com/" target="_blank" rel="noopener">Leaflet</a></div>`;

function home() {
  hoverOff();
  selRoute = null; lastStop = null; paint(); map.closePopup(); setRing(null);
  panel.classList.remove("sel");
  panel.innerHTML = `<h2 class="head">バス停を押してみてください</h2>
  <p>地図の点がバス停です（${stops.length.toLocaleString()}か所・${routes.length}系統）。押すと、そこを通る系統（路線）が出ます。系統を選ぶと、その系統が通るバス停だけが光ります。</p>
  <p>上の検索から、バス停名や系統名でも探せます（例：折尾駅、77系統）。</p>${NOTE}`;
}
function routeBtn(r) {
  return `<button class="rt" data-r="${r.i}"><span>${esc(routeLabel(r))}</span><small>${r.n}か所</small></button>`;
}
function groupedRoutes(rs) {
  let out = "", cur = "";
  rs.slice().sort(routeCmp).forEach(r => {
    if (r.g !== cur) { cur = r.g; out += `<div class="grp"><i style="background:var(--${r.g})"></i>${GLABEL[r.g]}</div>`; }
    out += routeBtn(r);
  });
  return out;
}
function showStop(s, fly) {
  hoverOff();
  selRoute = null; lastStop = s; paint(); setRing(s); panel.classList.add("sel");
  if (fly) map.setView([s.lat, s.lon], Math.max(map.getZoom(), 16));
  const rs = s.rts.map(i => routes[i]);
  panel.innerHTML = `<button class="back" id="bk">← もどる</button><h2 class="head">${esc(s.name)}</h2>
  <p>${rs.length ? "このバス停を通る系統（" + rs.length + "）" : "系統の情報がありません"}</p>${groupedRoutes(rs)}${NOTE}`;
  bind();
  panel.scrollTop = 0;
}
function showRoute(r) {
  hoverOff();
  selRoute = r; on[r.g] = true; syncChips(); paint(); map.closePopup(); panel.classList.add("sel");
  setRing(lastStop && r.stops.includes(lastStop) ? lastStop : null);
  map.fitBounds(L.latLngBounds(r.stops.map(s => [s.lat, s.lon])), { padding: [24, 24], maxZoom: 16 });
  const back = lastStop ? `← ${esc(lastStop.name)}にもどる` : "← もどる";
  panel.innerHTML = `<button class="back" id="bk">${back}</button><h2 class="head">${esc(routeLabel(r))}</h2>
  <p>${esc(OPNAME(r.op))}／データ上のバス停 ${r.n}か所</p>
  <p class="tip">※バス停の順番は元データに無いため、通るバス停だけを光らせています。名前を押すと地図でその場所に寄ります。</p>
  <ul class="stoplist">${r.names.slice().sort((a, b) => a.localeCompare(b, "ja")).map(n => `<li><button data-n="${esc(n)}">${esc(n)}</button></li>`).join("")}</ul>${NOTE}`;
  document.getElementById("bk").onclick = () => lastStop ? showStop(lastStop) : home();
  panel.querySelectorAll(".stoplist button").forEach(b => {
    const same = () => r.stops.filter(x => x.name === b.dataset.n);
    b.onclick = () => {
      const s = same()[0]; if (!s) return;
      map.setView([s.lat, s.lon], Math.max(map.getZoom(), 15)); hoverOn(same());
    };
    b.onmouseenter = b.onfocus = () => hoverOn(same());
    b.onmouseleave = b.onblur = () => hoverOff();
  });
  panel.scrollTop = 0;
}
function bind() {
  panel.querySelectorAll(".rt").forEach(b => b.onclick = () => showRoute(routes[+b.dataset.r]));
  const bk = document.getElementById("bk"); if (bk) bk.onclick = home;
}

// フィルタ
const chips = document.getElementById("chips"), chipEls = {};
GORDER.forEach(g => {
  const c = document.createElement("button"); c.className = "chip"; c.setAttribute("aria-pressed", "true");
  c.innerHTML = `<i style="background:var(--${g})"></i><span class="long">${GLABEL[g]}</span><span class="short">${GSHORT[g]}</span>`;
  c.setAttribute("aria-label", GLABEL[g] + "のバス停を表示");
  c.onclick = () => { on[g] = !on[g]; syncChips(); map.closePopup(); paint(); };
  chips.appendChild(c); chipEls[g] = c;
});
function syncChips() { GORDER.forEach(g => chipEls[g].setAttribute("aria-pressed", on[g])); }

// 検索（Enter／↑↓／Escに対応）
const q = document.getElementById("q"), sug = document.getElementById("sug");
const kana = t => t.normalize("NFKC").toLowerCase();
const items = [...routes.map(r => ({ t: "r", r, key: kana(routeLabel(r) + " " + OPNAME(r.op)) })),
  ...stops.map(s => ({ t: "s", s, key: kana(s.name) }))];
let hit = [], act = -1;
function pick(it) {
  sug.hidden = true; q.value = ""; act = -1;
  it.t === "r" ? showRoute(it.r) : (map.setView([it.s.lat, it.s.lon], 16), showStop(it.s));
}
function setAct(k) {
  act = k;
  sug.querySelectorAll("button[data-k]").forEach((b, i) => { b.classList.toggle("act", i === act); b.setAttribute("aria-selected", i === act); if (i === act) b.scrollIntoView({ block: "nearest" }); });
}
q.oninput = () => {
  const v = kana(q.value.trim()); act = -1;
  if (!v) { sug.hidden = true; return; }
  hit = items.filter(it => it.key.includes(v));
  hit.sort((a, b) => (a.t === b.t ? 0 : a.t === "r" ? -1 : 1) || (a.key.startsWith(v) ? 0 : 1) - (b.key.startsWith(v) ? 0 : 1));
  hit = hit.slice(0, 40);
  sug.innerHTML = hit.map((it, k) => it.t === "r"
    ? `<button role="option" data-k="${k}">${esc(routeLabel(it.r))}<small>系統・${esc(OPNAME(it.r.op))}</small></button>`
    : `<button role="option" data-k="${k}">${esc(it.s.name)}<small>バス停・${esc(OPNAME(it.s.op))}・${it.s.rts.length}系統</small></button>`).join("") || `<button disabled>見つかりません</button>`;
  sug.hidden = false;
  sug.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => pick(hit[+b.dataset.k]));
};
q.onkeydown = e => {
  if (e.key === "Escape") { sug.hidden = true; return; }
  if (sug.hidden || !hit.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); setAct((act + 1) % hit.length); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setAct((act - 1 + hit.length) % hit.length); }
  else if (e.key === "Enter") { e.preventDefault(); pick(hit[act >= 0 ? act : 0]); }
};
document.addEventListener("click", e => { if (!e.target.closest(".searchwrap")) sug.hidden = true; });
home();
map.invalidateSize();
</script>
</body>
</html>
