function orderRoute(r) {

  const by = new Map();

  const P = [...by.values()].map(a => ({ name: a.name, x: (a.lo / a.c) * 91, y: (a.la / a.c) * 111, st: a.st }));
  const n = P.length; if (n <= 2) return P.sort((a, b) => a.x - b.x).map(p => p.name);
  const d = (a, b) => Math.hypot(P[a].x - P[b].x, P[a].y - P[b].y);
  // Prim法で最小全域木
  const par = new Array(n).fill(-1), best = new Array(n).fill(Infinity), inT = new Array(n).fill(false), adj = P.map(() => []);
  best[0] = 0;
  for (let k = 0; k < n; k++) {
    let u = -1; for (let i = 0; i < n; i++) if (!inT[i] && (u < 0 || best[i] < best[u])) u = i;
    inT[u] = true; if (par[u] >= 0) { adj[u].push(par[u]); adj[par[u]].push(u); }
    for (let v = 0; v < n; v++) if (!inT[v]) { const w = d(u, v); if (w < best[v]) { best[v] = w; par[v] = u; } }
  }
  const bfs = src => { const dist = new Array(n).fill(-1), prev = new Array(n).fill(-1); dist[src] = 0; const q = [src];
    for (let h = 0; h < q.length; h++) { const u = q[h]; adj[u].forEach(v => { if (dist[v] < 0) { dist[v] = dist[u] + 1; prev[v] = u; q.push(v); } }); }
    return { dist, prev }; };
  const far = res => res.dist.indexOf(Math.max(...res.dist));
  const A = far(bfs(0)); const rb = bfs(A); const B = far(rb);
  let path = []; for (let v = B; v >= 0; v = rb.prev[v]) path.push(v);   // B→A
  path.reverse();                                                       // A→B
  if (P[path[0]].x > P[path[path.length - 1]].x) path.reverse();        // 西の端から始める
  // 軸に乗らないバス停は、軸に最短でつながる地点の直後に入れる
  const onPath = new Map(path.map((v, i) => [v, i])), anchor = new Array(n).fill(-1), depth = new Array(n).fill(0), q = [];
  path.forEach((v, i) => { anchor[v] = i; q.push(v); });
  for (let h = 0; h < q.length; h++) { const u = q[h]; adj[u].forEach(v => { if (anchor[v] < 0) { anchor[v] = anchor[u]; depth[v] = depth[u] + 1; q.push(v); } }); }
  const groups = path.map(() => []); for (let v = 0; v < n; v++) if (!onPath.has(v)) groups[anchor[v]].push(v);
  const out = []; path.forEach((v, i) => { out.push(v); groups[i].sort((a, b) => depth[a] - depth[b] || d(v, a) - d(v, b)).forEach(x => out.push(x)); });
