<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミートボーのドット絵・ステージ図鑑</title><style>body{margin:30px auto;padding:0 20px;max-width:960px;background:#f6f4ea;color:#254c3d;font-family:system-ui,sans-serif}h1{font-size:24px}h2{font-size:17px;margin-top:28px}p,a{font-size:13px;color:#45674f}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;background:#e2e9d7;border:1px solid #b5c5a4;border-radius:4px}#sprites{width:768px;background:repeating-conic-gradient(#e2e9d7 0% 25%,#f7f6ee 0% 50%) 50% / 16px 16px}a{display:inline-block;margin:14px 20px 0 0}section canvas{width:960px}</style></head><body><h1>MIITOBOW — よりみち図鑑</h1><p>丸い茶色の顔、大きな目、緑のパーカー、黒いパンツ、赤いサンダル。参考画像から手打ちで描いたオリジナルのドット絵です。</p><h2>ミートボー / 8フレーム・各32 × 40px</h2><canvas id="sprites" width="256" height="40" aria-label="ミートボーの8フレームのスプライトシート"></canvas><a id="download" download="miitobow-sprites.png">透過PNGを保存</a><a href="index.html">ゲームで遊ぶ →</a><p>左から：待機・歩き3種・ジャンプ・スケート・左向き・左ジャンプ。</p><h2>街のいたずらっ子</h2><p>くしゃぽん：風で動きだした紙くず。道をころころ歩きます。<br>あめもく：低く漂う小さな雨雲。キラリを見せると、しばらくおやすみします。</p><div id="worlds"></div><script src="engine.js"></script><script src="art.js"></script><script>
const spriteCanvas=document.querySelector('#sprites'),s=spriteCanvas.getContext('2d');
const poses=[[0,1,false,false,false],[.06,1,true,false,false],[.16,1,true,false,false],[.29,1,true,false,false],[0,1,false,true,false],[.1,1,true,false,true],[0,-1,false,false,false],[0,-1,false,true,false]];
spriteCanvas.height=48;document.querySelector('h2').textContent='ミートボー / 8フレーム・各32 × 48px';poses.forEach((p,i)=>MiitobowArt.player(s,i*32+4,6,...p));document.querySelector('#download').href=spriteCanvas.toDataURL('image/png');
for(let i=0;i<3;i++){const section=document.createElement('section'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=`0${i+1} — ${MiitobowEngine.themes[i].name}`;c.width=640;c.height=360;c.setAttribute('aria-label',h.textContent);section.append(h,c);document.querySelector('#worlds').append(section);const g=new MiitobowEngine.Game();g.load(i);g.camera=i===0?450:1350;g.time=2;g.player.x=g.camera+160;g.player.y=264;g.player.grounded=true;MiitobowArt.render(c.getContext('2d'),g,true);}
</script></body></html>
