<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f8f9fb">
<title>リンク集</title>
<style>
:root{
  --bg:#f8f9fb; --panel:#ffffff; --ink:#221f1b; --ink-soft:#6b6459; --ink-faint:#9c9488;
  --lime:#6fae2f; --lime-bright:#86d93e; --forest:#3e7a57; --forest-deep:#2c5a40;
  --line:rgba(34,31,27,.12); --chip:#eef3e6; --chip-on:#3e7a57; --err:#c4414d;
  --shadow:rgba(44,90,64,.22);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171a; --panel:#1d2226; --ink:#f1ede6; --ink-soft:#b3aa9b; --ink-faint:#8b8478;
    --line:rgba(255,255,255,.13); --chip:#232b22; --chip-on:#6fae2f; --shadow:rgba(0,0,0,.5); --err:#ff7a85; --theme:#14171a}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.7;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}

/* ---- 入口（パスワード） ---- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 18px}
.gate-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 22px 24px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px var(--shadow)}
.gate h1{font-size:1.15rem;font-weight:800;letter-spacing:.04em;margin-bottom:18px;text-align:center}
.field{display:block;width:100%;font-size:16px;min-height:50px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.field:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(111,174,47,.25)}
.remember{display:flex;align-items:center;gap:10px;margin:14px 2px 0;font-size:.9rem;color:var(--ink-soft);min-height:44px}
.remember input{width:20px;height:20px;accent-color:var(--forest)}
.err{color:var(--err);font-size:.9rem;min-height:1.4em;margin:6px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border:0;border-radius:999px;font:inherit;font-weight:800;font-size:1rem;color:#fff;cursor:pointer;text-decoration:none;
  background:linear-gradient(to bottom,rgba(255,255,255,.18),rgba(255,255,255,0) 40%),var(--forest);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 3px 0 var(--forest-deep),0 10px 20px -8px var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 1px 0 var(--forest-deep),0 6px 12px -8px var(--shadow)}
.btn[disabled]{opacity:.6;cursor:wait}
.gate .btn{width:100%;margin-top:12px}

/* ---- 一覧 ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.top h1{font-size:1.25rem;font-weight:800;letter-spacing:.03em}
.lock{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);font:inherit;font-size:.85rem;font-weight:700;cursor:pointer}
.search{margin:10px 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:.88rem;font-weight:700;cursor:pointer}
.chip small{color:var(--ink-faint);font-weight:700;margin-left:4px}
.chips.tags{margin:-6px 0 14px}
.chips.tags .chip{min-height:34px;font-size:.8rem;background:transparent}
.chips.tags .chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.count{font-size:.82rem;color:var(--ink-faint);margin:0 2px 10px}
.cards{display:grid;gap:12px;padding-bottom:48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--line)}
.card .cat{font-size:.74rem;font-weight:800;letter-spacing:.06em;color:var(--forest)}
.card h2{font-size:1.02rem;line-height:1.5;font-weight:800}
.card p{font-size:.9rem;color:var(--ink-soft)}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.card .host{font-size:.8rem;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .btn{min-height:44px;padding:0 20px;font-size:.92rem;flex:none}
.empty{padding:30px 0;color:var(--ink-faint);text-align:center}
@media (min-width:720px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<main class="gate" id="gate">
  <form class="gate-card" id="gform" autocomplete="on">
    <h1>リンク集</h1>
    <input class="field" id="pw" type="password" name="password" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード" required>
    <label class="remember"><input type="checkbox" id="rem" checked>この端末で覚える</label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="go" type="submit">ひらく</button>
  </form>
</main>

<div id="app" hidden>
  <div class="wrap">
    <div class="top"><h1>参考サイト</h1><button class="lock" id="lock" type="button">ロック</button></div>
    <input class="field search" id="q" type="search" placeholder="さがす" aria-label="さがす" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="chips tags" id="tags" hidden></div>
    <p class="count" id="count"></p>
    <div class="cards" id="cards"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var KEY = "mf.k." + (P.kid || "0");
  var $ = function(id){ return document.getElementById(id); };
  var data = null, cat = "すべて", tag = "すべて";

  function b64d(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function b64e(u){ var s=""; for (var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  function store(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
  function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

  async function deriveKey(pw){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  }
  async function decrypt(key){
    var buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(P.iv)}, key, b64d(P.ct));
    return JSON.parse(new TextDecoder().decode(buf));
  }

  function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  function render(){
    var q = $("q").value.trim().toLowerCase();
    var sites = data.sites.slice().sort(function(a,b){ return (b.added||"").localeCompare(a.added||""); });
    var chips = $("chips"); chips.textContent = "";
    var catsOf = function(s){ return s.categories || (s.category ? [s.category] : []); };
    var counts = {}; sites.forEach(function(s){ catsOf(s).forEach(function(c){ counts[c] = (counts[c]||0)+1; }); });
    var cats = ["すべて"].concat((data.categories||[]).filter(function(c){ return counts[c]; }));
    Object.keys(counts).forEach(function(c){ if (cats.indexOf(c) < 0) cats.push(c); });
    cats.forEach(function(c){
      var b = el("button","chip",c); b.type="button"; b.setAttribute("aria-pressed", String(c===cat));
      var n = c==="すべて" ? sites.length : counts[c]; var sm = el("small",null,String(n)); b.appendChild(sm);
      b.addEventListener("click", function(){ cat=c; tag="すべて"; render(); });
      chips.appendChild(b);
    });
    var inCat = sites.filter(function(s){ return cat === "すべて" || catsOf(s).indexOf(cat) >= 0; });
    var tc = {}; inCat.forEach(function(s){ (s.tags||[]).forEach(function(g){ tc[g]=(tc[g]||0)+1; }); });
    var tnames = Object.keys(tc);
    var tbox = $("tags"); tbox.textContent = "";
    if (cat !== "すべて" && tnames.length > 1) {
      tbox.hidden = false;
      ["すべて"].concat(tnames).forEach(function(g){
        var b = el("button","chip",g); b.type="button"; b.setAttribute("aria-pressed", String(g===tag));
        b.addEventListener("click", function(){ tag=g; render(); });
        tbox.appendChild(b);
      });
    } else { tbox.hidden = true; tag = "すべて"; }
    var list = inCat.filter(function(s){
      if (tag !== "すべて" && (s.tags||[]).indexOf(tag) < 0) return false;
      if (!q) return true;
      return (s.title+" "+(s.note||"")+" "+s.url+" "+catsOf(s).join(" ")+" "+(s.tags||[]).join(" ")).toLowerCase().indexOf(q) >= 0;
    });
    $("count").textContent = list.length + " 件";
    var box = $("cards"); box.textContent = "";
    if (!list.length) { box.appendChild(el("p","empty","見つかりません")); return; }
    list.forEach(function(s){
      var c = el("article","card");
      c.appendChild(el("div","cat",catsOf(s).concat(s.tags||[]).filter(function(v,i,arr){return arr.indexOf(v)===i;}).join(" ・ ")));
      c.appendChild(el("h2",null,s.title));
      if (s.note) c.appendChild(el("p",null,s.note));
      var m = el("div","meta"); m.appendChild(el("span","host",host(s.url)));
      var a = el("a","btn","ひらく"); a.href = s.url; a.target="_blank"; a.rel="noopener noreferrer"; a.setAttribute("aria-label", s.title+" をひらく");
      m.appendChild(a); c.appendChild(m); box.appendChild(c);
    });
  }

  function show(d){ data = d; $("gate").hidden = true; $("app").hidden = false; document.title = "参考サイト"; render(); }

  $("q").addEventListener("input", render);
  $("lock").addEventListener("click", function(){ store(KEY, null); location.reload(); });

  $("gform").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var btn = $("go"), err = $("err"); err.textContent = ""; btn.disabled = true; btn.textContent = "確認中…";
    try {
      var key = await deriveKey($("pw").value);
      var d = await decrypt(key);
      if ($("rem").checked) { var raw = await crypto.subtle.exportKey("raw", key); store(KEY, b64e(new Uint8Array(raw))); }
      $("pw").value = "";
      show(d);
    } catch(e){
      err.textContent = "パスワードが違います";
      btn.disabled = false; btn.textContent = "ひらく";
    }
  });

  (async function(){
    var saved = load(KEY);
    if (!saved || !(window.crypto && crypto.subtle)) return;
    try {
      var key = await crypto.subtle.importKey("raw", b64d(saved), {name:"AES-GCM"}, false, ["decrypt"]);
      show(await decrypt(key));
    } catch(e){ store(KEY, null); }
  })();

  window.__plain = P.plain || null;
  if (P.plain) { show(P.plain); }
})();
</script>
</body>
</html>
