  body {

  .header .desc { font-size:14px; color:#555; max-width:520px; margin:12px auto 0; line-height:1.7; }
  .series-grid {

  .series-card {

  .series-preview {

    justify-content:center;
    gap:8px;
    margin-bottom:14px;
  }
  .series-preview img {
    width:64px; height:64px; object-fit:contain;
    background:repeating-conic-gradient(#f1f1f1 0% 25%, #fafafa 0% 50%) 50% / 12px 12px;

  }
  .series-title { font-size:16px; font-weight:800; margin-bottom:6px; text-align:center; }
  .series-count { font-size:12px; color:#4CA468; font-weight:700; text-align:center; margin-bottom:8px; }
  .series-desc { font-size:13px; color:#666; line-height:1.6; text-align:center; }
  .series-badge {
    display:block; margin:12px auto 0; padding:5px 12px; border-radius:999px;
    background:#fff4e0; color:#b8860b; font-size:11.5px; font-weight:700;
    text-align:center; width:fit-content;
  }

    .header .desc { color:#b7c4bd; }
    .series-desc { color:#a9b6b0; }
    .series-preview img { background:repeating-conic-gradient(#22322a 0% 25%, #1a2620 0% 50%) 50% / 12px 12px; }
    .series-badge { background:#3a2e12; color:#f0c869; }
