<style>
  :root {
    --bg: #f6f9f4;
    --surface: #ffffff;
    --surface-soft: #eef3ea;
    --ink: #1f2b20;
    --ink-soft: #5c6b5c;
    --ink-faint: #93a190;
    --accent: #5f9c39;
    --accent-dark: #467029;
    --accent-glow: rgba(95, 156, 57, 0.14);
    --border: #dde6d8;
    --danger: #c1502e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12180f; --surface: #1b2317; --surface-soft: #212b1c;
      --ink: #eaf1e5; --ink-soft: #a7b8a2; --ink-faint: #6c7c68;
      --accent: #82c455; --accent-dark: #9ed873; --accent-glow: rgba(130, 196, 85, 0.18);
      --border: #2b3625; --danger: #e08a6c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12180f; --surface: #1b2317; --surface-soft: #212b1c;
    --ink: #eaf1e5; --ink-soft: #a7b8a2; --ink-faint: #6c7c68;
    --accent: #82c455; --accent-dark: #9ed873; --accent-glow: rgba(130, 196, 85, 0.18);
    --border: #2b3625; --danger: #e08a6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .head { font-family: "M PLUS Rounded 1c", "Hiragino Sans", sans-serif; font-weight: 900; letter-spacing: 0.02em; }

  #lock {
    position: relative;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center;
  }
  #lock .mark {
    width: 56px; height: 56px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: 0 6px 18px var(--accent-glow);
  }
  #lock h1 { font-size: 1.3rem; margin: 0; }
  #lock p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; }
  #pin-form { display: flex; gap: 10px; }
  .pin-box {
    width: 46px; height: 56px; text-align: center; font-size: 1.5rem;
    font-variant-numeric: tabular-nums; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--ink); outline: none;
  }
  .pin-box { width: 44px; }
  #pin-ok {
    width: 212px; height: 46px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent);
    color: #fff; font-size: 1rem; font-weight: 700; font-family: inherit; letter-spacing: 0.2em; cursor: pointer;
  }
  #pin-ok:hover { filter: brightness(1.06); }
  #pin-ok:active { transform: scale(0.97); }
  #pin-ok:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-glow); }
  .pin-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  /* 数字キーパッド：マウスで押せるように（PC＝ポインタが細かいデバイスだけ表示。スマホは端末の数字キーボードを使う） */
  #keypad { display: none; grid-template-columns: repeat(3, 64px); gap: 10px; }
  @media (hover: hover) and (pointer: fine) { #keypad { display: grid; } }
  .key {
    height: 52px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface);
    color: var(--ink); font-size: 1.25rem; font-family: inherit; font-variant-numeric: tabular-nums;
    cursor: pointer; transition: background 0.12s, border-color 0.12s, transform 0.06s;
  }
  .key:hover { border-color: var(--accent); background: var(--accent-glow); }
  .key:active { transform: scale(0.95); }
  .key:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .key.fn { font-size: 1rem; color: var(--ink-soft); }
  #lock-error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; visibility: hidden; max-width: 320px; line-height: 1.6; }
  #lock-error.show { visibility: visible; }
  #lock.shake #pin-form { animation: shake 0.35s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  #board { display: none; min-height: 100vh; flex-direction: column; }
  #board.show { display: flex; }
  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .topbar h1 { font-size: 1.1rem; margin: 0; }
  .topbar .count { font-size: 0.78rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 18px 16px 100px; display: flex; flex-direction: column; gap: 14px; }
  .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .composer textarea {
    resize: vertical; min-height: 84px; border: none; outline: none; background: transparent;
    color: var(--ink); font-family: inherit; font-size: 0.98rem; line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--ink-faint); }
  .composer #new-title {
    border: none; outline: none; background: transparent; color: var(--ink);
    font-family: inherit; font-size: 1.02rem; font-weight: 700; line-height: 1.5;
    padding: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }
  .composer #new-title::placeholder { color: var(--ink-faint); font-weight: 700; }
  .post-title { font-size: 1.05rem; font-weight: 700; color: var(--ink); }
  .composer-row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .hint { font-size: 0.76rem; color: var(--ink-faint); margin-right: auto; }
  .composer-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .image-pick-btn {
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-soft); border-radius: 10px; padding: 6px 10px;
    font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .image-pick-btn:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .image-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .image-preview-grid:empty { display: none; }
  .image-thumb { position: relative; width: 72px; height: 72px; }
  .image-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 10px; border: 1px solid var(--border); }
  .image-thumb .remove-image {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--danger); color: #fff; border: none; font-size: 0.75rem; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .post-image-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .post-image-grid .post-image-link {
    display: block; width: 110px; height: 110px; padding: 0; margin: 0; background: none;
    border: none; cursor: pointer; font: inherit;
  }
  .post-image-grid.count-1 .post-image-link { width: 100%; height: auto; max-height: 340px; }
  .post-image { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; background: var(--surface-soft); }
  .post-image-grid.count-1 .post-image { height: auto; object-fit: contain; }
  .post-video { width: 100%; max-height: 420px; border-radius: 10px; display: block; background: #000; margin-top: 6px; }
  .post-video + .save-all-btn { margin-top: 6px; }
  #video-preview-grid .image-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 10px; border: 1px solid var(--border); background: #000; }

  .image-lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 8, 0.86);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
  }
  .image-lightbox img {
    max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .lightbox-close {
    position: absolute; top: 16px; right: 18px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.14); color: #fff; font-size: 1.3rem; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.26); }
  .lightbox-actions { display: flex; gap: 10px; }
  .lightbox-actions .btn-primary { text-decoration: none; padding: 10px 26px; }

  .category-chip {
    display: inline-flex; align-items: center; gap: 5px; background: var(--accent-glow);
    color: var(--accent-dark); font-size: 0.78rem; font-weight: 700; border-radius: 999px;
    padding: 5px 11px; border: none; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .category-chip .chip-remove { font-weight: 900; opacity: 0.7; }
  .category-chip .chip-remove:hover { opacity: 1; }
  .category-picker { display: flex; flex-direction: column; gap: 8px; }
  .category-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .category-chips:empty { display: none; }
  .category-search-wrap { position: relative; }
  .category-search-wrap input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font-size: 0.86rem; font-family: inherit; background: var(--surface-soft);
    color: var(--ink);
  }
  .category-suggestions {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    max-height: 220px; overflow-y: auto; padding: 6px;
  }
  .category-suggestion-item {
    display: block; width: 100%; text-align: left; background: transparent; border: none; cursor: pointer;
    padding: 8px 10px; border-radius: 8px; font-size: 0.86rem; color: var(--ink); font-family: inherit;
  }
  .category-suggestion-item:hover, .category-suggestion-item.active { background: var(--accent-glow); color: var(--accent-dark); }
  .category-suggestion-item.create-new { color: var(--accent-dark); font-weight: 700; }
  .category-manage-toggle {
    align-self: flex-start; background: transparent; border: none; color: var(--ink-faint);
    font-size: 0.76rem; font-weight: 700; cursor: pointer; font-family: inherit; padding: 2px 0;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .category-manage-toggle:hover { color: var(--ink-soft); }
  .category-manage-panel {
    display: flex; flex-direction: column; gap: 6px; background: var(--surface-soft);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px;
  }
  .category-manage-row { display: flex; align-items: center; gap: 8px; }
  .category-manage-row .cat-name { flex: 1; font-size: 0.86rem; }
  .category-manage-row input[type="text"] {
    flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
    font-size: 0.86rem; font-family: inherit; background: var(--surface); color: var(--ink);
  }
  .category-manage-row button {
    font-size: 0.76rem; font-weight: 700; border-radius: 8px; padding: 5px 9px;
    background: transparent; border: 1px solid var(--border); color: var(--ink-soft); cursor: pointer;
    font-family: inherit;
  }
  .category-manage-row button:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .category-manage-row button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .category-manage-empty { font-size: 0.8rem; color: var(--ink-faint); }
  .post-categories { display: flex; flex-wrap: wrap; gap: 5px; }
  .post-categories:empty { display: none; }
  .post-category-tag {
    font-size: 0.72rem; font-weight: 700; color: var(--accent-dark); background: var(--accent-glow);
    border-radius: 999px; padding: 3px 9px;
  }
  .post-top { position: relative; display: flex; justify-content: flex-end; gap: 6px; }
  .save-all-btn {
    background: transparent; border: 1px dashed var(--border); color: var(--ink-faint);
    font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 3px 10px;
    cursor: pointer; font-family: inherit;
  }
  .save-all-btn:hover { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-glow); }
  .save-all-btn:disabled { opacity: 0.6; cursor: default; }
  .add-category-btn {
    background: transparent; border: 1px dashed var(--border); color: var(--ink-faint);
    font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 3px 10px;
    cursor: pointer; font-family: inherit;
  }
  .add-category-btn:hover { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-glow); }
  .add-category-popup {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; width: 220px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 8px;
  }
  .add-category-popup input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; font-size: 0.82rem; font-family: inherit; background: var(--surface-soft); color: var(--ink);
  }
  .add-category-suggestions { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  .category-filter-bar { display: flex; flex-direction: column; gap: 8px; margin-top: -2px; }
  .category-filter-search-wrap input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 10px; font-size: 0.84rem; font-family: inherit; background: var(--surface);
    color: var(--ink);
  }
  .category-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .category-filter-chip {
    display: inline-flex; align-items: center; font-size: 0.78rem; font-weight: 700; border-radius: 999px;
    padding: 5px 12px; border: 1px solid var(--border); cursor: pointer; font-family: inherit;
    background: var(--surface); color: var(--ink-soft);
  }
  .category-filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .date-filter-bar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-top: -4px; }
  .date-filter-field { display: flex; flex-direction: column; gap: 3px; font-size: 0.74rem; color: var(--ink-faint); font-weight: 700; }
  .date-filter-field input {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 0.82rem;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  .date-filter-clear {
    background: transparent; border: 1px solid var(--border); color: var(--ink-soft); border-radius: 999px;
    padding: 6px 12px; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .date-filter-clear:hover { background: var(--accent-glow); color: var(--accent-dark); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem;
    padding: 9px 20px; border-radius: 999px; transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .posts { display: flex; flex-direction: column; gap: 10px; }
  .post { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; }
  .post-text { white-space: pre-wrap; word-break: break-word; font-size: 0.96rem; line-height: 1.7; }
  .post-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .post-time { font-size: 0.74rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .post-actions { display: flex; gap: 6px; }
  .btn-ghost {
    background: var(--surface-soft); color: var(--ink-soft); font-size: 0.76rem; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; transition: background 0.15s ease, color 0.15s ease;
    border: none; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    font-family: inherit;
  }
  .btn-ghost:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .btn-ghost.copied { background: var(--accent); color: #fff; }
  .btn-ghost.danger:hover { background: rgba(193, 80, 46, 0.14); color: var(--danger); }
  .empty { text-align: center; color: var(--ink-faint); font-size: 0.88rem; padding: 40px 20px; }
  [hidden] { display: none !important; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent-dark); }
  #lock .back-link { position: absolute; top: 18px; left: 18px; }
  .topbar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-soft); border-radius: 999px; padding: 5px 11px;
    font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .refresh-btn:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .refresh-btn.spinning { animation: refresh-spin 0.6s linear; }
  @keyframes refresh-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .savedir-btn {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-soft); border-radius: 999px; padding: 5px 11px;
    font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .savedir-btn:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .savedir-btn.set { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-glow); }

  /* ===================== 第1段階：一覧UI（2026-11-15） ===================== */
  .topbar { padding: 0; gap: 0; }
  .topbar-inner { width: 100%; max-width: 820px; margin: 0 auto; padding: 8px 14px 8px; display: flex; flex-direction: column; gap: 8px; }
  .topbar-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar-row h1 { font-size: 1.05rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .back-icon { flex: none; padding: 6px 4px; min-height: 36px; }
  .topbar .count { font-size: 0.78rem; color: var(--ink-soft); white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
  .net-note { font-size: 0.72rem; color: var(--danger); white-space: nowrap; flex: none; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; position: relative; }
  .top-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-height: 36px; min-width: 36px;
    padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent;
    color: var(--ink-soft); font-size: 0.8rem; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .top-btn:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .top-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .top-btn.primary:hover { background: var(--accent-dark); color: #fff; }
  .top-btn.set { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-glow); }
  .search-row { display: flex; align-items: center; gap: 8px; }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  #search-input {
    width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 12px; padding: 0 38px 0 12px;
    font-family: inherit; font-size: 0.92rem; background: var(--surface); color: var(--ink);
  }
  #search-input::placeholder { color: var(--ink-soft); opacity: 0.8; }
  #search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #search-clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px;
    border-radius: 50%; background: transparent; color: var(--ink-soft); font-size: 1rem; cursor: pointer;
  }
  #search-clear:hover { background: var(--accent-glow); }
  .period-wrap { position: relative; flex: none; }

<script>
(function () {
  var SESSION_KEY = "miitobow-board-pin";
  var lockEl = document.getElementById("lock");
  var boardEl = document.getElementById("board");
  var pinForm = document.getElementById("pin-form");
  var pinBoxes = Array.prototype.slice.call(document.querySelectorAll(".pin-box"));
  var lockError = document.getElementById("lock-error");

  var postsEl = document.getElementById("posts");
  var emptyMsg = document.getElementById("empty-msg");
  var lightboxEl = document.getElementById("image-lightbox");
  var lightboxImg = document.getElementById("lightbox-img");
  var lightboxSave = document.getElementById("lightbox-save");
  var lightboxClose = document.getElementById("lightbox-close");
  var savedirBtn = document.getElementById("savedir-btn");

  // --- PC保存先フォルダ（File System Access API・対応ブラウザのみ） ---
  // 一度選んだフォルダのハンドルをIndexedDBに永続化し、以降の保存はそこへ直接書き込む。
  var FS_SUPPORTED = typeof window.showDirectoryPicker === "function";
  var saveDirHandle = null;
  var IDB_NAME = "miitobow-board-fs";
  var IDB_STORE = "handles";

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idbSet(key, val) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function updateSavedirBtnLabel() {
    if (saveDirHandle) {
      savedirBtn.textContent = "📁 " + saveDirHandle.name;
      savedirBtn.classList.add("set");
    } else {
      savedirBtn.textContent = "📁 保存先未設定";
      savedirBtn.classList.remove("set");
    }
  }

  function ensureSaveDirPermission(handle) {
    return handle.queryPermission({ mode: "readwrite" }).then(function (state) {
      if (state === "granted") return true;
      return handle.requestPermission({ mode: "readwrite" }).then(function (state2) {
        return state2 === "granted";
      });
    }).catch(function () { return false; });
  }

  if (FS_SUPPORTED) {
    savedirBtn.hidden = false;
    idbGet("saveDir").then(function (handle) {
      if (handle) {
        saveDirHandle = handle;
        updateSavedirBtnLabel();
      }
    }).catch(function () {});
    savedirBtn.addEventListener("click", function () {
      window.showDirectoryPicker({ mode: "readwrite" })
        .then(function (handle) {
          saveDirHandle = handle;
          updateSavedirBtnLabel();
          return idbSet("saveDir", handle);
        })
        .catch(function () {});
    });
  }

  function urlToBlob(url) {
    return fetch(url).then(function (res) { return res.blob(); });
  }

  function saveBlobViaDownload(filename, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  // 保存先フォルダが設定されていれば直接書き込み、無ければ従来通りブラウザダウンロード。
  function saveBlob(filename, blob, done) {
    if (!saveDirHandle) {
      saveBlobViaDownload(filename, blob);
      done();
      return;
    }
    ensureSaveDirPermission(saveDirHandle).then(function (ok) {
      if (!ok) {
        saveBlobViaDownload(filename, blob);
        done();
        return;
      }
      saveDirHandle.getFileHandle(filename, { create: true })
        .then(function (fh) { return fh.createWritable(); })
        .then(function (w) { return w.write(blob).then(function () { return w.close(); }); })
        .then(function () { done(); })
        .catch(function () {
          saveBlobViaDownload(filename, blob);
          done();
        });
    });
  }

  newText.addEventListener("paste", function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var handledAny = false;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item.kind !== "file") continue;
      if (item.type.indexOf("image/") === 0) {
        var imgFile = item.getAsFile();
        if (!imgFile) continue;
        handledAny = true;
        if (pendingImages.length >= IMAGE_MAX_COUNT) {
          hint.textContent = "1回に選べる画像は" + IMAGE_MAX_COUNT + "枚までです";
          continue;
        }
        readImageFile(imgFile, function (dataUrl, errMsg) {
          if (dataUrl) {
            pendingImages.push(dataUrl);
            renderImagePreview();
            if (selectedCategoryIds.indexOf("image") === -1) {
              selectedCategoryIds.push("image");
              renderSelectedChips();
            }
          } else if (errMsg) {
            hint.textContent = errMsg;
          }
        });
      } else if (item.type.indexOf("video/") === 0) {
        var vidFile = item.getAsFile();
        if (!vidFile) continue;
        handledAny = true;
        readVideoFile(vidFile, function (dataUrl, errMsg) {
          if (dataUrl) {
            pendingVideo = dataUrl;
            renderVideoPreview();
            if (selectedCategoryIds.indexOf("video") === -1) {
              selectedCategoryIds.push("video");
              renderSelectedChips();
            }
          } else if (errMsg) {
            hint.textContent = errMsg;
          }
        });
      }
    }
    if (handledAny) e.preventDefault();
  });

  function readImageFile(file, done) {

  function createCategory(name, done) {

      .then(function (result) {

          allCategories.push(result.data);

  // ===== 設定値（将来、配布版で外出しできるよう、調整しそうな数字はここに集める） =====
  var CONFIG = {
    PAGE_SIZE: 30,            // 一覧は30件ずつ表示
    POLL_MS: 30000,           // 一覧の自動更新間隔
    CATEGORY_POLL_MS: 120000, // カテゴリー一覧の自動更新間隔
    TITLE_FALLBACK_CHARS: 40, // 題名なしの投稿は本文1行目をこの文字数まで見出しにする
    SNIPPET_BEFORE: 16,       // 検索で本文に当たったときの抜粋（当たった語の前）
    SNIPPET_AFTER: 44,        // 同（当たった語のあと）
    UI_KEY: "miitobow-board-ui" // 検索・絞り込みの保存キー（localStorage）
  };

  var viewState = { q: "", tokens: [], limit: CONFIG.PAGE_SIZE };
  var lastAllPosts = [];
  var postsLoaded = false;
  var postsLoadFailed = false;

  // --- 検索の正規化：全角半角・大文字小文字・カタカナ/ひらがなをそろえる（文字数は変えない＝強調表示の位置がずれない） ---
  function normKey(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      var code = ch.charCodeAt(0);
      if (code < 128) { out += ch.toLowerCase(); continue; }
      if (code >= 0xD800 && code <= 0xDFFF) { out += ch; continue; }
      var n = ch.normalize("NFKC").toLowerCase();
      if (n.length !== 1) { n = ch.toLowerCase(); if (n.length !== 1) n = ch; }
      var c = n.charCodeAt(0);
      if (c >= 0x30A1 && c <= 0x30F6) n = String.fromCharCode(c - 0x60);
      out += n;
    }
    return out;
  }
  function tokenize(q) { return normKey(q).split(/\s+/).filter(Boolean); }

  var hayCache = {};
  function postHay(p) {
    var sig = (p.title || "").length + "|" + (p.text || "").length;
    var c = hayCache[p.id];
    if (!c || c.sig !== sig) {
      c = hayCache[p.id] = { sig: sig, h: normKey((p.title || "") + "\n" + (p.text || "")) };
    }
    return c.h;
  }
  function postCatHay(p) {
    var cats = Array.isArray(p.categories) ? p.categories : [];
    return normKey(cats.map(categoryName).join("\n"));
  }
  function applySearchFilter(posts) {
    var tokens = viewState.tokens;
    if (!tokens.length) return posts;
    return posts.filter(function (p) {
      var hay = postHay(p) + "\n" + postCatHay(p);
      for (var i = 0; i < tokens.length; i++) { if (hay.indexOf(tokens[i]) === -1) return false; }
      return true;
    });
  }

  // --- カテゴリー絞り込み（複数選んだら「どれか1つでも当てはまる」） ---
  function applyCategoryFilter(posts) {
    if (!activeFilterIds.length) return posts;
    return posts.filter(function (p) {
      var cats = Array.isArray(p.categories) ? p.categories : [];
      return activeFilterIds.some(function (id) { return cats.indexOf(id) !== -1; });
    });
  }

  // --- 日付での絞り込み ---
  function parseLocalDate(dateStr, endOfDay) {
    // <input type="date">の値("YYYY-MM-DD")をローカルタイムゾーンの0時/23:59:59.999として解釈する
    var parts = dateStr.split("-");
    var y = Number(parts[0]), m = Number(parts[1]) - 1, d = Number(parts[2]);
    return endOfDay ? new Date(y, m, d, 23, 59, 59, 999).getTime() : new Date(y, m, d, 0, 0, 0, 0).getTime();
  }
  function applyDateFilter(posts) {
    var fromVal = dateFilterFrom.value;
    var toVal = dateFilterTo.value;
    if (!fromVal && !toVal) return posts;
    var fromTs = fromVal ? parseLocalDate(fromVal, false) : null;
    var toTs = toVal ? parseLocalDate(toVal, true) : null;
    return posts.filter(function (p) {
      var ts = p.createdAt || 0;
      if (fromTs !== null && ts < fromTs) return false;
      if (toTs !== null && ts > toTs) return false;
      return true;
    });
  }
  function applyAllFilters(posts) {
    return applySearchFilter(applyDateFilter(applyCategoryFilter(posts)));
  }
  function filtersActive() {
    return !!(viewState.tokens.length || activeFilterIds.length || dateFilterFrom.value || dateFilterTo.value);
  }

  // --- 絞り込み状態の保存・復元（localStorage。使えない環境でも動く） ---
  function persistUi() {
    try {
      localStorage.setItem(CONFIG.UI_KEY, JSON.stringify({
        q: viewState.q, cats: activeFilterIds, from: dateFilterFrom.value, to: dateFilterTo.value
      }));
    } catch (e) {}
  }
  function restoreUi() {
    try {
      var raw = localStorage.getItem(CONFIG.UI_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (!s || typeof s !== "object") return;
      if (typeof s.q === "string") { searchInput.value = s.q; viewState.q = s.q.trim(); viewState.tokens = tokenize(viewState.q); }
      if (Array.isArray(s.cats)) activeFilterIds = s.cats.filter(function (x) { return typeof x === "string"; });
      if (typeof s.from === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s.from)) dateFilterFrom.value = s.from;
      if (typeof s.to === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s.to)) dateFilterTo.value = s.to;
    } catch (e) {}
    searchClear.hidden = !searchInput.value;
    updatePeriodButton();
  }
  var idsPruned = false;
  function pruneUnknownFilterIds() {
    // 消えたカテゴリーのidが保存されていると、0件のまま抜け出せなくなるので外す
    if (idsPruned) return;
    idsPruned = true;
    var known = {};
    allCategories.forEach(function (c) { known[c.id] = true; });
    lastAllPosts.forEach(function (p) { (Array.isArray(p.categories) ? p.categories : []).forEach(function (id) { known[id] = true; }); });
    var kept = activeFilterIds.filter(function (id) { return known[id]; });
    if (kept.length !== activeFilterIds.length) { activeFilterIds = kept; persistUi(); }
  }

  function onFilterChanged() {
    viewState.limit = CONFIG.PAGE_SIZE;
    persistUi();
    refreshList(true);
  }
  function clearAllFilters() {
    activeFilterIds = [];
    searchInput.value = "";
    searchClear.hidden = true;
    viewState.q = "";
    viewState.tokens = [];
    dateFilterFrom.value = "";
    dateFilterTo.value = "";
    updatePeriodButton();
    onFilterChanged();
  }

  // --- カテゴリーのチップ（件数つき・「すべて」つき） ---
  function categoryCounts(all) {
    var m = {};
    all.forEach(function (p) {
      (Array.isArray(p.categories) ? p.categories : []).forEach(function (id) { m[id] = (m[id] || 0) + 1; });
    });
    return m;
  }
  function makeFilterChip(label, n, active, onClick) {
    var chip = document.createElement("button");
    chip.type = "button";
    chip.className = "category-filter-chip" + (active ? " active" : "") + (n === 0 ? " zero" : "");
    chip.setAttribute("aria-pressed", active ? "true" : "false");
    var l = document.createElement("span");
    l.textContent = label;
    chip.appendChild(l);
    var c = document.createElement("span");
    c.className = "n";
    c.textContent = String(n);
    chip.appendChild(c);
    chip.addEventListener("click", onClick);
    return chip;
  }
  function renderFilterChips() {
    categoryFilterChipsEl.innerHTML = "";
    var counts = categoryCounts(lastAllPosts);
    var ids = allCategories.map(function (c) { return c.id; });
    // 投稿にだけ付いていて一覧に無いカテゴリー（動画など）も、絞り込めるよう並べる
    Object.keys(counts).forEach(function (id) { if (ids.indexOf(id) === -1) ids.push(id); });
    categoryFilterBar.hidden = ids.length === 0;
    if (!ids.length) return;
    categoryFilterChipsEl.appendChild(makeFilterChip("すべて", lastAllPosts.length, activeFilterIds.length === 0, function () {
      activeFilterIds = [];
      onFilterChanged();
    }));
    ids.forEach(function (id) {
      var active = activeFilterIds.indexOf(id) !== -1;
      categoryFilterChipsEl.appendChild(makeFilterChip(categoryName(id), counts[id] || 0, active, function () {
        if (activeFilterIds.indexOf(id) === -1) activeFilterIds.push(id);
        else activeFilterIds = activeFilterIds.filter(function (x) { return x !== id; });
        onFilterChanged();
      }));
    });

  // コピー：まず navigator.clipboard、だめなら昔ながらの方法。成否を正直に返す。
  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }
  function copyToClipboard(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }
  // ボタンを一瞬だけ「コピー済み」の見た目にする

  // KVは結果整合性のため、投稿/削除の直後は最大1分ほどGETに反映されないことがある。
  // 体験を損なわないよう、確定前の変更をローカルに保持してサーバー結果とマージする。
  var serverPosts = [];
  var localAdds = []; // {id, text, createdAt} まだGET結果に出てきていない自分の投稿
  var localDeletes = []; // GET結果からまだ消えていない、削除済みのid

  function mergedPosts() {
    var byId = {};
    serverPosts.forEach(function (p) { byId[p.id] = p; });
    localAdds.forEach(function (p) { if (!byId[p.id]) byId[p.id] = p; });
    localDeletes.forEach(function (id) { delete byId[id]; });
    var list = Object.keys(byId).map(function (k) { return byId[k]; });
    list.sort(function (a, b) { return b.createdAt - a.createdAt; });
    // サーバーに載った分はローカル差分から外す（掃除）
    localAdds = localAdds.filter(function (p) { return !serverPosts.some(function (s) { return s.id === p.id; }); });
    localDeletes = localDeletes.filter(function (id) { return serverPosts.some(function (s) { return s.id === id; }); });
    return list;
  }

    return imageBlobCache[imgId];

  function downloadSequentially(urls, baseFilename, done) {
    var i = 0;
    function next() {
      if (i >= urls.length) { if (done) done(); return; }
      var idx = i++;
      var filename = baseFilename + (urls.length > 1 ? "-" + (idx + 1) : "") + ".jpg";
      urlToBlob(urls[idx])
        .then(function (blob) {
          saveBlob(filename, blob, function () {
            setTimeout(next, saveDirHandle ? 0 : 350);
          });
        })
        .catch(next);
    }
    next();
  }

    Promise.all(promises).then(function (urls) {
      var valid = urls.filter(Boolean);
      return new Promise(function (resolve) {
        downloadSequentially(valid, "miitobow-board-" + (data.createdAt || Date.now()), resolve);
      });
    }).then(function () { done(); }, function () { done(); });
  }

  // --- 検索語の強調表示と、URLの押せるリンク化（要素を1つずつ作る。本文をinnerHTMLに入れない） ---
  function appendHighlighted(parent, text, tokens) {
    if (!text) return;
    if (!tokens || !tokens.length) { parent.appendChild(document.createTextNode(text)); return; }
    var nt = normKey(text);
    if (nt.length !== text.length) { parent.appendChild(document.createTextNode(text)); return; }
    var flags = new Uint8Array(text.length);
    var any = false;
    tokens.forEach(function (t) {
      if (!t) return;
      var from = 0, i;
      while ((i = nt.indexOf(t, from)) !== -1) {
        for (var k = i; k < i + t.length; k++) flags[k] = 1;
        any = true;
        from = i + t.length;
      }
    });
    if (!any) { parent.appendChild(document.createTextNode(text)); return; }
    var i2 = 0;
    while (i2 < text.length) {
      var on = flags[i2] === 1;
      var j = i2;
      while (j < text.length && (flags[j] === 1) === on) j++;
      var piece = text.slice(i2, j);
      if (on) {
        var mk = document.createElement("mark");
        mk.className = "hl";
        mk.textContent = piece;
        parent.appendChild(mk);
      } else {
        parent.appendChild(document.createTextNode(piece));
      }
      i2 = j;
    }
  }
  var URL_RE = /https?:\/\/[^\s<>"'　]+/g;
  function trimUrl(u) {
    var m = u.match(/[.,;:!?)\]}>、。，．）」』】]+$/);
    return m ? u.slice(0, u.length - m[0].length) : u;
  }
  function appendRich(el, text, tokens) {
    var last = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text)) !== null) {
      var url = trimUrl(m[0]);
      if (!/^https?:\/\/[^\/]/.test(url)) continue;
      appendHighlighted(el, text.slice(last, m.index), tokens);
      var a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      appendHighlighted(a, url, tokens);
      el.appendChild(a);
      last = m.index + url.length;
      URL_RE.lastIndex = last;
    }
    appendHighlighted(el, text.slice(last), tokens);
  }
  function extractUrls(text) {
    var out = [], m;
    var re = /https?:\/\/[^\s<>"'　]+/g;
    while ((m = re.exec(text)) !== null) {
      var url = trimUrl(m[0]);
      if (/^https?:\/\/[^\/]/.test(url) && out.indexOf(url) === -1) out.push(url);
    }
    return out;
  }

    var wrap = document.createElement("div");

    videoEl.controls = true;
    videoEl.preload = "metadata";
    getVideoBlobUrl(data.video)
      .then(function (url) { videoEl.src = url; })
      .catch(function () {
        videoEl.replaceWith(document.createTextNode("動画の読み込みに失敗しました"));
      });
    var videoSaveBtn = document.createElement("button");
    videoSaveBtn.className = "save-all-btn";
    videoSaveBtn.type = "button";
    videoSaveBtn.textContent = "⬇ 動画を保存";
    videoSaveBtn.addEventListener("click", function () {
      videoSaveBtn.disabled = true;
      videoSaveBtn.textContent = "保存中…";
      saveVideoOf(data, function () {
        videoSaveBtn.disabled = false;
        videoSaveBtn.textContent = "⬇ 動画を保存";
      });
    });
    wrap.appendChild(videoEl);
    wrap.appendChild(videoSaveBtn);
    return wrap;
  }

  // --- ひらいた中身 ---
  function buildBody(data, tokens) {
    var body = document.createElement("div");
    body.className = "post-body";

    var grid = buildImageGrid(data);
    if (grid) body.appendChild(grid);
    var vid = buildVideoBlock(data);
    if (vid) body.appendChild(vid);

    if (data.text) {
      var textEl = document.createElement("div");
      textEl.className = "post-text clamped";
      appendRich(textEl, data.text, tokens);
      body.appendChild(textEl);
      var moreText = document.createElement("button");
      moreText.type = "button";
      moreText.className = "more-text-btn";
      moreText.textContent = "全部見る";
      moreText.hidden = true;
      moreText.addEventListener("click", function () {
        var clamped = textEl.classList.toggle("clamped");
        moreText.textContent = clamped ? "全部見る" : "たたむ";
      });
      body.appendChild(moreText);
    }

    var postCategories = Array.isArray(data.categories) ? data.categories : [];
    if (postCategories.length) {
      var catRow = document.createElement("div");
      catRow.className = "post-categories";
      postCategories.forEach(function (cid) {
        var tag = document.createElement("span");
        tag.className = "post-category-tag";
        tag.textContent = categoryName(cid);
        catRow.appendChild(tag);
      });
      body.appendChild(catRow);
    }

    var actions = document.createElement("div");
    actions.className = "post-actions-row";
    if (data.title && data.text) {
      var both = document.createElement("button");
      both.type = "button";
      both.className = "btn-ghost";
      both.textContent = "題名＋本文をコピー";
      both.addEventListener("click", function () { doCopy(data.title + "\n" + data.text, both, "✓ コピーしました"); });
      actions.appendChild(both);
    }
    var urls = extractUrls(data.text || "");
    if (urls.length) {
      var urlBtn = document.createElement("button");
      urlBtn.type = "button";
      urlBtn.className = "btn-ghost";
      urlBtn.textContent = urls.length > 1 ? "URLだけコピー（" + urls.length + "件）" : "URLだけコピー";
      urlBtn.addEventListener("click", function () { doCopy(urls.join("\n"), urlBtn, "✓ コピーしました"); });
      actions.appendChild(urlBtn);
    }
    var saveAll = buildSaveAllButton(data);
    if (saveAll) actions.appendChild(saveAll);
    actions.appendChild(buildAddCategoryWidget(data));
    body.appendChild(actions);

    var t = document.createElement("div");
    t.className = "post-body-time";
    t.textContent = fmtTime(data.createdAt || 0);
    body.appendChild(t);
    return body;
  }
  // 長い本文は12行で切り、「全部見る」を出す（実際に切れている時だけ）
  function measureClamp(body) {
    requestAnimationFrame(function () {
      var t = body.querySelector(".post-text");
      var b = body.querySelector(".more-text-btn");
      if (t && b && t.classList.contains("clamped")) b.hidden = !(t.scrollHeight > t.clientHeight + 2);
    });
  }

  // --- 行の「⋯」メニュー ---
  var rowMenuEl = null;
  function closeRowMenu() {
    if (rowMenuEl) { rowMenuEl.remove(); rowMenuEl = null; }
  }
  function openRowMenu(anchor, data, card) {
    closeRowMenu();
    var m = document.createElement("div");
    m.className = "menu-pop fixed";
    m.setAttribute("role", "menu");
    function addItem(label, danger, fn) {
      var it = document.createElement("button");
      it.type = "button";
      it.className = "menu-item" + (danger ? " danger" : "");
      it.setAttribute("role", "menuitem");
      it.textContent = label;
      it.addEventListener("click", function (e) {
        e.stopPropagation();
        closeRowMenu();
        fn();
      });
      m.appendChild(it);
    }
    addItem("＋ カテゴリーを追加", false, function () {
      card.__setOpen(true);
      var b = card.querySelector(".add-category-btn");
      if (b) b.click();
    });
    addItem("🗑 削除", true, function () { confirmDeletePost(data); });
    document.body.appendChild(m);
    var r = anchor.getBoundingClientRect();
    var w = m.offsetWidth, h = m.offsetHeight;
    var left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
    var top = r.bottom + 4;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
    m.style.left = left + "px";
    m.style.top = top + "px";
    rowMenuEl = m;
  }
  window.addEventListener("scroll", closeRowMenu, { passive: true });

  // --- 確認ダイアログ（削除用） ---
  var confirmResolve = null;
  function confirmDialog(message, okLabel) {
    return new Promise(function (resolve) {
      confirmMsg.textContent = message;
      confirmOk.textContent = okLabel || "OK";
      confirmModal.hidden = false;
      confirmResolve = resolve;
      confirmCancel.focus();
    });
  }
  function closeConfirm(result) {
    if (!confirmResolve) return;
    var r = confirmResolve;
    confirmResolve = null;
    confirmModal.hidden = true;
    r(result);
  }
  confirmOk.addEventListener("click", function () { closeConfirm(true); });
  confirmCancel.addEventListener("click", function () { closeConfirm(false); });
  confirmModal.addEventListener("click", function (e) { if (e.target === confirmModal) closeConfirm(false); });

  function confirmDeletePost(data) {
    var t = displayTitle(data);
    if (t.length > 30) t = t.slice(0, 30) + "…";
    confirmDialog("この投稿を削除します。元に戻せません。\n「" + t + "」", "削除する").then(function (ok) {
      if (ok) performDelete(data);
    });
  }
  function performDelete(data) {
    var id = data.id;
    // 投稿したばかりでサーバーの一覧にまだ載っていない自分の投稿は、ローカルの控えからも外す
    // （外さないと、次の自動更新で消したはずの投稿がまた出てしまう）
    var wasLocalAdd = localAdds.some(function (p) { return p.id === id; });
    localAdds = localAdds.filter(function (p) { return p.id !== id; });
    localDeletes.push(id);
    delete openIds[id];
    refreshList(true);
    fetch("/api/board/" + encodeURIComponent(id), {
      method: "DELETE",
      headers: { "X-Board-Pin": currentPin },
    }).then(function (res) {
      if (!res.ok) throw new Error("delete failed");
    }).catch(function () {
      // 失敗したら一覧に戻して、正直に知らせる
      localDeletes = localDeletes.filter(function (x) { return x !== id; });
      if (wasLocalAdd) localAdds.push(data);
      refreshList(true);
      showToast("削除できませんでした。通信を確かめてもう一度どうぞ", 3200);
    });
  }

  // --- 行（カード）1枚 ---
  function buildPostCard(data, tokens) {
    var id = data.id;
    var card = document.createElement("article");
    card.className = "post";
    card.setAttribute("data-id", id);

    var row = document.createElement("div");
    row.className = "post-row";

    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "post-toggle";
    toggle.setAttribute("aria-expanded", "false");

    var caret = document.createElement("span");
    caret.className = "post-caret";
    caret.setAttribute("aria-hidden", "true");
    caret.textContent = "▸";
    toggle.appendChild(caret);

    var kind = document.createElement("span");
    kind.className = "post-kind";
    kind.setAttribute("aria-hidden", "true");
    kind.textContent = kindIcon(data);
    toggle.appendChild(kind);

    var main = document.createElement("div");
    main.className = "post-main";
    var titleLine = document.createElement("div");
    titleLine.className = "post-title-line";
    var titleText = displayTitle(data);
    appendHighlighted(titleLine, titleText, tokens);
    main.appendChild(titleLine);

    // 検索で本文に当たった時は、当たった所の前後を1行出す（題名に当たっていれば出さない）
    if (tokens.length && data.text) {
      var normTitle = normKey(titleText);
      var normText = normKey(data.text);
      var firstIdx = -1, firstLen = 0;
      tokens.forEach(function (t) {
        var i = normText.indexOf(t);
        if (i !== -1 && normTitle.indexOf(t) === -1 && (firstIdx === -1 || i < firstIdx)) { firstIdx = i; firstLen = t.length; }
      });
      if (firstIdx !== -1) {
        var s = Math.max(0, firstIdx - CONFIG.SNIPPET_BEFORE);
        var e2 = Math.min(data.text.length, firstIdx + firstLen + CONFIG.SNIPPET_AFTER);
        var snippet = data.text.slice(s, e2).replace(/\s+/g, " ");
        var sn = document.createElement("div");
        sn.className = "post-snippet";
        if (s > 0) sn.appendChild(document.createTextNode("…"));
        appendHighlighted(sn, snippet, tokens);
        if (e2 < data.text.length) sn.appendChild(document.createTextNode("…"));
        main.appendChild(sn);
      }
    }

    var meta = document.createElement("div");
    meta.className = "post-meta";
    var cats = Array.isArray(data.categories) ? data.categories : [];
    if (cats.length) {
      var mc = document.createElement("span");
      mc.className = "m-cat";
      var names = cats.slice(0, 2).map(categoryName).join("・");
      if (cats.length > 2) names += " +" + (cats.length - 2);
      mc.textContent = names;
      meta.appendChild(mc);
    }
    var mt = document.createElement("span");
    mt.className = "m-time";
    mt.textContent = fmtShort(data.createdAt || 0);
    meta.appendChild(mt);
    main.appendChild(meta);
    toggle.appendChild(main);
    row.appendChild(toggle);

    // 行の右端：ワンタップのコピー（本文だけ）。画像・動画だけの投稿は「保存」
    var quick = document.createElement("div");
    quick.className = "post-quick";
    var primary = document.createElement("button");
    primary.type = "button";
    primary.className = "q-btn";
    if (data.text) {
      primary.textContent = "コピー";
      primary.setAttribute("aria-label", "本文をコピー");
      primary.addEventListener("click", function (e) { e.stopPropagation(); doCopy(data.text, primary, "✓"); });
    } else if (data.title) {
      primary.textContent = "コピー";
      primary.setAttribute("aria-label", "題名をコピー");
      primary.addEventListener("click", function (e) { e.stopPropagation(); doCopy(data.title, primary, "✓"); });
    } else if (imageCount(data)) {
      primary.textContent = "保存";
      primary.setAttribute("aria-label", "画像を保存");
      primary.addEventListener("click", function (e) {
        e.stopPropagation();
        primary.disabled = true;
        primary.textContent = "…";
        saveAllImages(data, function () { primary.disabled = false; primary.textContent = "保存"; });
      });
    } else if (data.video) {
      primary.textContent = "保存";
      primary.setAttribute("aria-label", "動画を保存");
      primary.addEventListener("click", function (e) {
        e.stopPropagation();
        primary.disabled = true;
        primary.textContent = "…";
        saveVideoOf(data, function () { primary.disabled = false; primary.textContent = "保存"; });
      });
    } else {
      primary = null;
    }
    if (primary) quick.appendChild(primary);
    var menuBtn = document.createElement("button");
    menuBtn.type = "button";
    menuBtn.className = "q-btn icon";
    menuBtn.textContent = "⋯";
    menuBtn.setAttribute("aria-label", "その他の操作");
    menuBtn.setAttribute("aria-haspopup", "menu");
    menuBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (rowMenuEl) { closeRowMenu(); return; }
      openRowMenu(menuBtn, data, card);
    });
    quick.appendChild(menuBtn);
    row.appendChild(quick);
    card.appendChild(row);

    // ひらく／とじる（ひらいた時に初めて中身と画像を作る）
    var bodyEl = null;
    function setOpen(open) {
      if (open) openIds[id] = true; else delete openIds[id];
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      card.classList.toggle("open", open);
      if (open && !bodyEl) {
        bodyEl = buildBody(data, tokens);
        card.appendChild(bodyEl);
        measureClamp(bodyEl);
      } else if (!open && bodyEl) {
        bodyEl.remove();
        bodyEl = null;
      }
    }
    card.__setOpen = setOpen;
    toggle.addEventListener("click", function () { setOpen(!openIds[id]); });
    if (openIds[id]) setOpen(true);
    return card;
  }

  // --- 一覧全体 ---
  function postSig(p) {
    var cats = Array.isArray(p.categories) ? p.categories.join(",") : "";
    var t = p.text || "";
    return p.id + ":" + (p.title || "") + ":" + t.length + ":" + t.slice(0, 12) + ":" + cats + ":" + imageCount(p) + ":" + (p.video ? 1 : 0);
  }
  // 30秒ごとの自動更新で、中身が変わっていなければ描き直さない（ひらいた投稿・選択・スクロールを保つ）
  function refreshList(force) {
    var all = mergedPosts();
    lastAllPosts = all;
    if (postsLoaded && !idsPruned) pruneUnknownFilterIds();
    var filtered = applyAllFilters(all);
    currentFiltered = filtered;
    var key = [
      postsLoaded ? 1 : 0, postsLoadFailed ? 1 : 0, all.map(postSig).join("¦"), JSON.stringify(allCategories),
      viewState.q, activeFilterIds.join(","), dateFilterFrom.value, dateFilterTo.value, viewState.limit
    ].join("||");
    if (!force && key === lastViewKey) return;
    lastViewKey = key;
    renderList(all, filtered);
  }

  function renderList(all, filtered) {
    var tokens = viewState.tokens;
    postsEl.innerHTML = "";
    countEl.textContent = all.length ? (filtersActive() ? filtered.length + "/" + all.length + "件" : all.length + "件") : "";
    renderFilterChips();
    renderFilterStatus(all.length, filtered.length);

    if (!postsLoaded) {
      moreBtn.hidden = true;
      if (postsLoadFailed) {
        emptyBox.hidden = false;
        emptyMsg.textContent = "読み込めませんでした。右上の「⟳」でもう一度どうぞ";
        emptyReset.hidden = true;
      } else {
        emptyBox.hidden = true;
      }
      return;
    }

    var shown = filtered.slice(0, viewState.limit);
    var frag = document.createDocumentFragment();
    shown.forEach(function (d) { frag.appendChild(buildPostCard(d, tokens)); });
    postsEl.appendChild(frag);

    var rest = filtered.length - shown.length;
    moreBtn.hidden = rest <= 0;
    if (rest > 0) moreBtn.textContent = "もっと見る（残り" + rest + "件）";

    if (!filtered.length) {
      emptyBox.hidden = false;
      if (!all.length) {
        emptyMsg.textContent = "まだ投稿がありません。「＋」から最初の1件を書いてみましょう";
        emptyReset.hidden = true;
      } else {
        emptyMsg.textContent = "当てはまる投稿がありません";
        emptyReset.hidden = false;
      }
    } else {
      emptyBox.hidden = true;
    }
  }

  function loadPosts() {
    return fetch("/api/board", { headers: { "X-Board-Pin": currentPin } })
      .then(function (res) {
        if (res.status === 401) { throw new Error("unauthorized"); }
        if (!res.ok) { throw new Error("failed"); }
        return res.json();
      })
      .then(function (posts) {
        serverPosts = Array.isArray(posts) ? posts : [];
        postsLoaded = true;
        postsLoadFailed = false;
        netNote.hidden = true;
        refreshList(false);
        return true;
      })
      .catch(function () {
        netNote.hidden = false;
        if (!postsLoaded) { postsLoadFailed = true; refreshList(true); }
        return false;
      });
  }

  function submitPost() {
    var title = newTitle.value.trim();
    var text = newText.value.trim();
    var images = pendingImages.slice();
    var video = pendingVideo;
    if (!text && !images.length && !video && !title) return;
    postBtn.disabled = true;
    hint.textContent = "";
    var categories = selectedCategoryIds.slice();
    var body = { text: text };
    if (title) body.title = title;
    if (images.length) body.images = images;
    if (video) body.video = video;
    if (categories.length) body.categories = categories;
    fetch("/api/board", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Board-Pin": currentPin },
      body: JSON.stringify(body),
    })
      .then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (err) {
            throw new Error(err.message || "failed");
          });
        }
        return res.json();
      })
      .then(function (created) {
        localAdds.push(created);
        refreshList(true);
        newTitle.value = "";
        newText.value = "";
        pendingImages = [];
        renderImagePreview();
        pendingVideo = null;
        renderVideoPreview();
        selectedCategoryIds = [];
        renderSelectedChips();
        closeComposer();
        window.scrollTo(0, 0);
        var visible = currentFiltered.some(function (p) { return p.id === created.id; });
        showToast(visible ? "投稿しました" : "投稿しました（絞り込み中のため、一覧には出ていません）", 3000);
      })
      .catch(function (err) {
        hint.textContent = (err && err.message) || "投稿に失敗しました";
      })
      .finally(function () {
        postBtn.disabled = false;
      });
  }

  // --- 投稿ウィンドウ（ふだんは閉じておく。PC＝上の「＋ 投稿」、スマホ＝右下の丸ボタン） ---
  function openComposer() {
    composerModal.hidden = false;
    document.body.classList.add("composer-open");
    document.body.style.overflow = "hidden";
    setTimeout(function () { newText.focus(); }, 30);
  }
  function closeComposer() {
    composerModal.hidden = true;
    document.body.classList.remove("composer-open");
    document.body.style.overflow = "";
    categorySuggestionsEl.hidden = true;
  }

  // Escで、いちばん手前に開いているものを閉じる。閉じたら true
  function closeTopLayer() {
    if (confirmResolve) { closeConfirm(false); return true; }
    if (rowMenuEl) { closeRowMenu(); return true; }
    if (!topMenu.hidden) { topMenu.hidden = true; return true; }
    if (!periodPanel.hidden) { periodPanel.hidden = true; return true; }
    if (!composerModal.hidden) { closeComposer(); return true; }
    return false;
  }

  var boardWired = false;
  function wireBoardUi() {
    if (boardWired) return;
    boardWired = true;

    postBtn.addEventListener("click", submitPost);
    newText.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submitPost();
    });
    newTitle.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); newText.focus(); }
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submitPost();
    });

    openComposerBtn.addEventListener("click", openComposer);
    fabBtn.addEventListener("click", openComposer);
    composerClose.addEventListener("click", closeComposer);
    var downOnBackdrop = false;
    composerModal.addEventListener("mousedown", function (e) { downOnBackdrop = e.target === composerModal; });
    composerModal.addEventListener("click", function (e) {
      if (downOnBackdrop && e.target === composerModal) closeComposer();
      downOnBackdrop = false;
    });

    refreshBtn.addEventListener("click", function () {
      refreshBtn.disabled = true;
      refreshBtn.classList.add("spinning");
      loadPosts().then(function (ok) {
        if (!ok) showToast("更新できませんでした。通信を確かめてください", 3000);
      }).finally(function () {
        refreshBtn.disabled = false;
        setTimeout(function () { refreshBtn.classList.remove("spinning"); }, 600);
      });
    });

    // スマホの「＋」ボタンは、下へスクロール中は隠し（行のボタンに重ならない）、上へ戻すと出す
    var lastY = window.scrollY;
    window.addEventListener("scroll", function () {
      var y = window.scrollY;
      if (y < 80 || y < lastY - 4) fabBtn.classList.remove("away");
      else if (y > lastY + 8) fabBtn.classList.add("away");
      lastY = y;
    }, { passive: true });

    topMenuBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      topMenu.hidden = !topMenu.hidden;
    });

    // メニュー・期間の小窓・行のメニューは、外を押したら閉じる
    document.addEventListener("click", function (e) {
      if (!topMenu.hidden && !topMenu.contains(e.target) && e.target !== topMenuBtn) topMenu.hidden = true;
      if (!periodPanel.hidden && !periodPanel.contains(e.target) && !periodBtn.contains(e.target)) periodPanel.hidden = true;
      if (rowMenuEl && !rowMenuEl.contains(e.target)) closeRowMenu();
    });

    document.addEventListener("keydown", function (e) {
      if (!lightboxEl.hidden) return; // 画像の拡大表示は、元のEsc処理に任せる
      if (e.key === "Escape") {
        if (closeTopLayer()) return;
        if (document.activeElement === searchInput && searchInput.value) {
          searchInput.value = ""; searchClear.hidden = true; clearTimeout(searchTimer); applySearchNow();
        }
        return;
      }
      // 「/」で検索欄へ（文字入力中は反応しない）
      if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
        var tag = (document.activeElement && document.activeElement.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        if (!composerModal.hidden || confirmResolve) return;
        e.preventDefault();
        searchInput.focus();
      }
    });
  }

  function showBoard(pin) {
    currentPin = pin;
    lockEl.style.display = "none";
    boardEl.classList.add("show");
    wireBoardUi();
    restoreUi();
    loadCategories().then(loadPosts);
    // 30秒間隔（元は15秒）。タブが裏に隠れている間は読みに行かない（読み取り回数の節約）。
    setInterval(function () { if (!document.hidden) loadPosts(); }, CONFIG.POLL_MS);
    setInterval(function () { if (!document.hidden) loadCategories(); }, CONFIG.CATEGORY_POLL_MS);
  }

  function tryUnlock(pin) {
    fetch("/api/board", { headers: { "X-Board-Pin": pin } }).then(function (res) {
      if (res.status === 429) {
        lockError.textContent = "まちがいが続いたため、しばらく入力できません。15分ほど待ってからもう一度どうぞ";
        lockError.classList.add("show");
        pinBoxes.forEach(function (b) { b.value = ""; });
        return;
      }
      if (res.status === 401) {
        lockError.textContent = "パスコードが違います";
        lockError.classList.add("show");
        lockEl.classList.add("shake");
        setTimeout(function () { lockEl.classList.remove("shake"); }, 350);
        pinBoxes.forEach(function (b) { b.value = ""; });
        pinBoxes[0].focus();
        return;
      }
      try { sessionStorage.setItem(SESSION_KEY, pin); } catch (e) {}
      showBoard(pin);
    }).catch(function () {
      lockError.textContent = "通信に失敗しました";
      lockError.classList.add("show");
    });
  }

  pinBoxes.forEach(function (box, i) {
    box.addEventListener("input", function () {
      box.value = box.value.replace(/[^0-9]/g, "").slice(0, 1);
      if (box.value && i < pinBoxes.length - 1) pinBoxes[i + 1].focus();
    });
    box.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !box.value && i > 0) pinBoxes[i - 1].focus();
      if (e.key === "ArrowLeft" && i > 0) pinBoxes[i - 1].focus();
      if (e.key === "ArrowRight" && i < pinBoxes.length - 1) pinBoxes[i + 1].focus();
    });
  });
  // 桁数が分からないように自動送信はしない。「決定」ボタンかEnterで、入力した数字をそのまま送る
  function submitPin() {
    var joined = pinBoxes.map(function (b) { return b.value; }).join("");
    if (!joined) return;
    lockError.classList.remove("show");
    tryUnlock(joined);
  }
  pinForm.addEventListener("submit", function (e) { e.preventDefault(); submitPin(); });
  // キーパッドのボタンにフォーカスがある時でもEnterで送れるようにする（ロック画面が出ている間だけ）
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || getComputedStyle(lockEl).display === "none") return;
    e.preventDefault();
    submitPin();
  });

  // 数字キーパッド（マウス用）：空いている最初の枠に入れる（送信は「決定」かEnter）
  Array.prototype.forEach.call(document.querySelectorAll("#keypad .key"), function (key) {
    key.addEventListener("click", function () {
      var k = key.getAttribute("data-k");
      lockError.classList.remove("show");
      if (k === "clear") {
        pinBoxes.forEach(function (b) { b.value = ""; });
        pinBoxes[0].focus();
      } else if (k === "back") {
        for (var j = pinBoxes.length - 1; j >= 0; j--) {
          if (pinBoxes[j].value) { pinBoxes[j].value = ""; pinBoxes[j].focus(); break; }
        }
      } else {
        for (var i = 0; i < pinBoxes.length; i++) {
          if (!pinBoxes[i].value) {
            pinBoxes[i].value = k;
            pinBoxes[i].dispatchEvent(new Event("input", { bubbles: true }));
            break;
          }
        }
      }
    });
  });

  var savedPin = null;
  try { savedPin = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
  if (savedPin) {
    tryUnlock(savedPin);
  } else {
    pinBoxes[0].focus();
  }
})();
</script>
</body>
</html>
