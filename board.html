<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ミートボー掲示板 | miitobow</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/board-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ミートボー掲示板">
<meta name="theme-color" content="#f6f9f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f9f4;
    --surface: #ffffff;
    --surface-soft: #eef3ea;
    --ink: #1f2b20;
    --ink-soft: #5c6b5c;
    --ink-faint: #93a190;
    --accent: #5f9c39;
    --accent-dark: #467029;
    --accent-glow: rgba(95, 156, 57, 0.14);
    --border: #dde6d8;
    --danger: #c1502e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12180f; --surface: #1b2317; --surface-soft: #212b1c;
      --ink: #eaf1e5; --ink-soft: #a7b8a2; --ink-faint: #6c7c68;
      --accent: #82c455; --accent-dark: #9ed873; --accent-glow: rgba(130, 196, 85, 0.18);
      --border: #2b3625; --danger: #e08a6c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12180f; --surface: #1b2317; --surface-soft: #212b1c;
    --ink: #eaf1e5; --ink-soft: #a7b8a2; --ink-faint: #6c7c68;
    --accent: #82c455; --accent-dark: #9ed873; --accent-glow: rgba(130, 196, 85, 0.18);
    --border: #2b3625; --danger: #e08a6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .head { font-family: "M PLUS Rounded 1c", "Hiragino Sans", sans-serif; font-weight: 900; letter-spacing: 0.02em; }

  #lock {
    position: relative;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center;
  }
  #lock .mark {
    width: 56px; height: 56px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: 0 6px 18px var(--accent-glow);
  }
  #lock h1 { font-size: 1.3rem; margin: 0; }
  #lock p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; }
  #pin-form { display: flex; gap: 10px; }
  .pin-box {
    width: 46px; height: 56px; text-align: center; font-size: 1.5rem;
    font-variant-numeric: tabular-nums; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--ink); outline: none;
  }
  .pin-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  #lock-error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; visibility: hidden; }
  #lock-error.show { visibility: visible; }
  #lock.shake #pin-form { animation: shake 0.35s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  #board { display: none; min-height: 100vh; flex-direction: column; }
  #board.show { display: flex; }
  .topbar {
    position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .topbar h1 { font-size: 1.1rem; margin: 0; }
  .topbar .count { font-size: 0.78rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 18px 16px 100px; display: flex; flex-direction: column; gap: 14px; }
  .composer { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .composer textarea {
    resize: vertical; min-height: 84px; border: none; outline: none; background: transparent;
    color: var(--ink); font-family: inherit; font-size: 0.98rem; line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--ink-faint); }
  .composer #new-title {
    border: none; outline: none; background: transparent; color: var(--ink);
    font-family: inherit; font-size: 1.02rem; font-weight: 700; line-height: 1.5;
    padding: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }
  .composer #new-title::placeholder { color: var(--ink-faint); font-weight: 700; }
  .post-title { font-size: 1.05rem; font-weight: 700; color: var(--ink); }
  .composer-row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .hint { font-size: 0.76rem; color: var(--ink-faint); margin-right: auto; }
  .composer-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .image-pick-btn {
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-soft); border-radius: 10px; padding: 6px 10px;
    font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .image-pick-btn:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .image-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .image-preview-grid:empty { display: none; }
  .image-thumb { position: relative; width: 72px; height: 72px; }
  .image-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 10px; border: 1px solid var(--border); }
  .image-thumb .remove-image {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--danger); color: #fff; border: none; font-size: 0.75rem; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .post-image-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .post-image-grid .post-image-link {
    display: block; width: 110px; height: 110px; padding: 0; margin: 0; background: none;
    border: none; cursor: pointer; font: inherit;
  }
  .post-image-grid.count-1 .post-image-link { width: 100%; height: auto; max-height: 340px; }
  .post-image { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; background: var(--surface-soft); }
  .post-image-grid.count-1 .post-image { height: auto; object-fit: contain; }

  .image-lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 8, 0.86);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px;
  }
  .image-lightbox img {
    max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .lightbox-close {
    position: absolute; top: 16px; right: 18px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.14); color: #fff; font-size: 1.3rem; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.26); }
  .lightbox-actions { display: flex; gap: 10px; }
  .lightbox-actions .btn-primary { text-decoration: none; padding: 10px 26px; }

  .category-chip {
    display: inline-flex; align-items: center; gap: 5px; background: var(--accent-glow);
    color: var(--accent-dark); font-size: 0.78rem; font-weight: 700; border-radius: 999px;
    padding: 5px 11px; border: none; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .category-chip .chip-remove { font-weight: 900; opacity: 0.7; }
  .category-chip .chip-remove:hover { opacity: 1; }
  .category-picker { display: flex; flex-direction: column; gap: 8px; }
  .category-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .category-chips:empty { display: none; }
  .category-search-wrap { position: relative; }
  .category-search-wrap input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; font-size: 0.86rem; font-family: inherit; background: var(--surface-soft);
    color: var(--ink);
  }
  .category-suggestions {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    max-height: 220px; overflow-y: auto; padding: 6px;
  }
  .category-suggestion-item {
    display: block; width: 100%; text-align: left; background: transparent; border: none; cursor: pointer;
    padding: 8px 10px; border-radius: 8px; font-size: 0.86rem; color: var(--ink); font-family: inherit;
  }
  .category-suggestion-item:hover, .category-suggestion-item.active { background: var(--accent-glow); color: var(--accent-dark); }
  .category-suggestion-item.create-new { color: var(--accent-dark); font-weight: 700; }
  .category-manage-toggle {
    align-self: flex-start; background: transparent; border: none; color: var(--ink-faint);
    font-size: 0.76rem; font-weight: 700; cursor: pointer; font-family: inherit; padding: 2px 0;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .category-manage-toggle:hover { color: var(--ink-soft); }
  .category-manage-panel {
    display: flex; flex-direction: column; gap: 6px; background: var(--surface-soft);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px;
  }
  .category-manage-row { display: flex; align-items: center; gap: 8px; }
  .category-manage-row .cat-name { flex: 1; font-size: 0.86rem; }
  .category-manage-row input[type="text"] {
    flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
    font-size: 0.86rem; font-family: inherit; background: var(--surface); color: var(--ink);
  }
  .category-manage-row button {
    font-size: 0.76rem; font-weight: 700; border-radius: 8px; padding: 5px 9px;
    background: transparent; border: 1px solid var(--border); color: var(--ink-soft); cursor: pointer;
    font-family: inherit;
  }
  .category-manage-row button:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .category-manage-row button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .category-manage-empty { font-size: 0.8rem; color: var(--ink-faint); }
  .post-categories { display: flex; flex-wrap: wrap; gap: 5px; }
  .post-categories:empty { display: none; }
  .post-category-tag {
    font-size: 0.72rem; font-weight: 700; color: var(--accent-dark); background: var(--accent-glow);
    border-radius: 999px; padding: 3px 9px;
  }
  .post-top { position: relative; display: flex; justify-content: flex-end; gap: 6px; }
  .save-all-btn {
    background: transparent; border: 1px dashed var(--border); color: var(--ink-faint);
    font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 3px 10px;
    cursor: pointer; font-family: inherit;
  }
  .save-all-btn:hover { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-glow); }
  .save-all-btn:disabled { opacity: 0.6; cursor: default; }
  .add-category-btn {
    background: transparent; border: 1px dashed var(--border); color: var(--ink-faint);
    font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 3px 10px;
    cursor: pointer; font-family: inherit;
  }
  .add-category-btn:hover { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-glow); }
  .add-category-popup {
    position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; width: 220px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 8px;
  }
  .add-category-popup input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; font-size: 0.82rem; font-family: inherit; background: var(--surface-soft); color: var(--ink);
  }
  .add-category-suggestions { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  .category-filter-bar { display: flex; flex-direction: column; gap: 8px; margin-top: -2px; }
  .category-filter-search-wrap input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 10px; font-size: 0.84rem; font-family: inherit; background: var(--surface);
    color: var(--ink);
  }
  .category-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .category-filter-chip {
    display: inline-flex; align-items: center; font-size: 0.78rem; font-weight: 700; border-radius: 999px;
    padding: 5px 12px; border: 1px solid var(--border); cursor: pointer; font-family: inherit;
    background: var(--surface); color: var(--ink-soft);
  }
  .category-filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .date-filter-bar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; margin-top: -4px; }
  .date-filter-field { display: flex; flex-direction: column; gap: 3px; font-size: 0.74rem; color: var(--ink-faint); font-weight: 700; }
  .date-filter-field input {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 0.82rem;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  .date-filter-clear {
    background: transparent; border: 1px solid var(--border); color: var(--ink-soft); border-radius: 999px;
    padding: 6px 12px; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .date-filter-clear:hover { background: var(--accent-glow); color: var(--accent-dark); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem;
    padding: 9px 20px; border-radius: 999px; transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .posts { display: flex; flex-direction: column; gap: 10px; }
  .post { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; }
  .post-text { white-space: pre-wrap; word-break: break-word; font-size: 0.96rem; line-height: 1.7; }
  .post-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .post-time { font-size: 0.74rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .post-actions { display: flex; gap: 6px; }
  .btn-ghost {
    background: var(--surface-soft); color: var(--ink-soft); font-size: 0.76rem; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; transition: background 0.15s ease, color 0.15s ease;
    border: none; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    font-family: inherit;
  }
  .btn-ghost:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .btn-ghost.copied { background: var(--accent); color: #fff; }
  .btn-ghost.danger:hover { background: rgba(193, 80, 46, 0.14); color: var(--danger); }
  .empty { text-align: center; color: var(--ink-faint); font-size: 0.88rem; padding: 40px 20px; }
  [hidden] { display: none !important; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent-dark); }
  #lock .back-link { position: absolute; top: 18px; left: 18px; }
  .topbar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-soft); border-radius: 999px; padding: 5px 11px;
    font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .refresh-btn:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .refresh-btn.spinning { animation: refresh-spin 0.6s linear; }
  @keyframes refresh-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .savedir-btn {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-soft); border-radius: 999px; padding: 5px 11px;
    font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .savedir-btn:hover { background: var(--accent-glow); color: var(--accent-dark); }
  .savedir-btn.set { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-glow); }
</style>
</head>
<body>

<div id="lock">
  <a class="back-link" href="/">← miitobow.comに戻る</a>
  <div class="mark">📋</div>
  <h1 class="head">ミートボー掲示板</h1>
  <p>4桁のパスコードを入力してください</p>
  <form id="pin-form" autocomplete="off">
    <input class="pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="0">
    <input class="pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="1">
    <input class="pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="2">
    <input class="pin-box" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-i="3">
  </form>
  <div id="lock-error">パスコードが違います</div>
</div>

<div id="board">
  <div class="topbar">
    <div class="topbar-top">
      <a class="back-link" href="/">← miitobow.comに戻る</a>
      <div class="topbar-right">
        <span class="count" id="count"></span>
        <button class="savedir-btn" id="savedir-btn" type="button" hidden>📁 保存先未設定</button>
        <button class="refresh-btn" id="refresh-btn" type="button" aria-label="更新">⟳ 更新</button>
      </div>
    </div>
    <h1 class="head">ミートボー掲示板</h1>
  </div>
  <main>
    <div class="composer">
      <input type="text" id="new-title" placeholder="題名（任意）" maxlength="200">
      <textarea id="new-text" placeholder="ここに書いて投稿…"></textarea>
      <div class="composer-tools">
        <input type="file" id="image-input" accept="image/*" multiple hidden>
        <button class="image-pick-btn" id="image-pick-btn" type="button">📷 画像を選ぶ（複数可）</button>
      </div>
      <div class="image-preview-grid" id="image-preview-grid"></div>
      <div class="category-picker">
        <div class="category-chips" id="category-chips-selected"></div>
        <div class="category-search-wrap">
          <input type="text" id="category-search" placeholder="カテゴリーを検索 / 新規作成…" autocomplete="off">
          <div class="category-suggestions" id="category-suggestions" hidden></div>
        </div>
        <button class="category-manage-toggle" id="category-manage-toggle" type="button">✎ カテゴリーを編集</button>
        <div class="category-manage-panel" id="category-manage-panel" hidden></div>
      </div>
      <div class="composer-row">
        <span class="hint" id="composer-hint"></span>
        <button class="btn-primary" id="post-btn" type="button">投稿</button>
      </div>
    </div>
    <div class="category-filter-bar" id="category-filter-bar" hidden>
      <div class="category-filter-search-wrap">
        <input type="text" id="category-filter-search" placeholder="カテゴリーで絞り込み…" autocomplete="off">
      </div>
      <div class="category-filter-chips" id="category-filter-chips"></div>
    </div>
    <div class="date-filter-bar">
      <label class="date-filter-field">
        <span>開始日</span>
        <input type="date" id="date-filter-from">
      </label>
      <label class="date-filter-field">
        <span>終了日</span>
        <input type="date" id="date-filter-to">
      </label>
      <button class="date-filter-clear" id="date-filter-clear" type="button" hidden>クリア</button>
    </div>
    <div class="posts" id="posts"></div>
    <p class="empty" id="empty-msg" hidden>まだ投稿がありません</p>
  </main>
</div>

<div class="image-lightbox" id="image-lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" type="button" aria-label="閉じる">×</button>
  <img id="lightbox-img" alt="画像プレビュー">
  <div class="lightbox-actions">
    <button class="btn-primary" id="lightbox-save" type="button">保存</button>
  </div>
</div>

<script>
(function () {
  var SESSION_KEY = "miitobow-board-pin";
  var lockEl = document.getElementById("lock");
  var boardEl = document.getElementById("board");
  var pinForm = document.getElementById("pin-form");
  var pinBoxes = Array.prototype.slice.call(document.querySelectorAll(".pin-box"));
  var lockError = document.getElementById("lock-error");

  var postsEl = document.getElementById("posts");
  var emptyMsg = document.getElementById("empty-msg");
  var lightboxEl = document.getElementById("image-lightbox");
  var lightboxImg = document.getElementById("lightbox-img");
  var lightboxSave = document.getElementById("lightbox-save");
  var lightboxClose = document.getElementById("lightbox-close");
  var savedirBtn = document.getElementById("savedir-btn");

  // --- PC保存先フォルダ（File System Access API・対応ブラウザのみ） ---
  // 一度選んだフォルダのハンドルをIndexedDBに永続化し、以降の保存はそこへ直接書き込む。
  var FS_SUPPORTED = typeof window.showDirectoryPicker === "function";
  var saveDirHandle = null;
  var IDB_NAME = "miitobow-board-fs";
  var IDB_STORE = "handles";

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idbSet(key, val) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function updateSavedirBtnLabel() {
    if (saveDirHandle) {

      savedirBtn.classList.remove("set");
    }
  }

  function ensureSaveDirPermission(handle) {
    return handle.queryPermission({ mode: "readwrite" }).then(function (state) {
      if (state === "granted") return true;
      return handle.requestPermission({ mode: "readwrite" }).then(function (state2) {
        return state2 === "granted";
      });
    }).catch(function () { return false; });
  }

  if (FS_SUPPORTED) {
    savedirBtn.hidden = false;
    idbGet("saveDir").then(function (handle) {
      if (handle) {
        saveDirHandle = handle;
        updateSavedirBtnLabel();
      }
    }).catch(function () {});
    savedirBtn.addEventListener("click", function () {
      window.showDirectoryPicker({ mode: "readwrite" })
        .then(function (handle) {
          saveDirHandle = handle;
          updateSavedirBtnLabel();
          return idbSet("saveDir", handle);
        })
        .catch(function () {});
    });
  }

  function urlToBlob(url) {
    return fetch(url).then(function (res) { return res.blob(); });
  }

  function saveBlobViaDownload(filename, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  // 保存先フォルダが設定されていれば直接書き込み、無ければ従来通りブラウザダウンロード。
  function saveBlob(filename, blob, done) {
    if (!saveDirHandle) {
      saveBlobViaDownload(filename, blob);
      done();
      return;
    }
    ensureSaveDirPermission(saveDirHandle).then(function (ok) {
      if (!ok) {
        saveBlobViaDownload(filename, blob);
        done();
        return;
      }
      saveDirHandle.getFileHandle(filename, { create: true })
        .then(function (fh) { return fh.createWritable(); })
        .then(function (w) { return w.write(blob).then(function () { return w.close(); }); })
        .then(function () { done(); })
        .catch(function () {
          saveBlobViaDownload(filename, blob);
          done();
        });
    });
  }

  // 元画質のまま保存する代わりに、あまり大きすぎるファイルだけは弾く
  // （画像は直近20枚しか保持しない仕組みなので、通常の写真サイズなら気にしなくてよい）。
  var IMAGE_MAX_FILE_BYTES = 15 * 1024 * 1024;
  var IMAGE_MAX_COUNT = 20;

  function readImageFile(file, done) {
    if (file.size > IMAGE_MAX_FILE_BYTES) {
      done(null, "画像が大きすぎます(15MBまで)");
      return;
    }
    var reader = new FileReader();
    reader.onload = function () { done(reader.result, null); };
    reader.onerror = function () { done(null, "画像の読み込みに失敗しました"); };
    reader.readAsDataURL(file);
  }

  function renderImagePreview() {
    imagePreviewGrid.innerHTML = "";
    pendingImages.forEach(function (dataUrl, idx) {
      var thumb = document.createElement("div");
      thumb.className = "image-thumb";
      var img = document.createElement("img");
      img.src = dataUrl;
      img.alt = "添付画像プレビュー";
      thumb.appendChild(img);
      var removeBtn = document.createElement("button");
      removeBtn.className = "remove-image";
      removeBtn.type = "button";
      removeBtn.setAttribute("aria-label", "この画像を外す");
      removeBtn.textContent = "×";
      removeBtn.addEventListener("click", function () {
        pendingImages.splice(idx, 1);
        renderImagePreview();
      });
      thumb.appendChild(removeBtn);
      imagePreviewGrid.appendChild(thumb);
    });
  }

  imagePickBtn.addEventListener("click", function () { imageInput.click(); });

  imageInput.addEventListener("change", function () {
    var files = imageInput.files ? Array.prototype.slice.call(imageInput.files) : [];
    imageInput.value = "";
    if (!files.length) return;
    if (pendingImages.length + files.length > IMAGE_MAX_COUNT) {
      hint.textContent = "1回に選べる画像は" + IMAGE_MAX_COUNT + "枚までです";
      files = files.slice(0, IMAGE_MAX_COUNT - pendingImages.length);
      if (!files.length) return;
    }
    hint.textContent = "画像を読み込み中…";
    var remaining = files.length;
    files.forEach(function (file) {
      readImageFile(file, function (dataUrl, errMsg) {
        remaining -= 1;
        if (dataUrl) {
          pendingImages.push(dataUrl);
        } else if (errMsg) {
          hint.textContent = errMsg;
        }
        if (remaining === 0) {
          if (hint.textContent === "画像を読み込み中…") hint.textContent = "";
          renderImagePreview();

  function categoryName(id) {
    var found = allCategories.filter(function (c) { return c.id === id; })[0];
    return found ? found.name : id;

  function loadCategories() {
    return fetch("/api/board/categories", { headers: { "X-Board-Pin": currentPin } })

      .then(function (list) {

  function createCategory(name, done) {
    fetch("/api/board/categories", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Board-Pin": currentPin },
      body: JSON.stringify({ name: name }),
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok) {
          allCategories.push(result.data);
          done(result.data);
        } else if (result.data && result.data.category) {
          // 既に同名がある場合はそれを使う
          done(result.data.category);
        } else {
          hint.textContent = (result.data && result.data.message) || "カテゴリーの作成に失敗しました";
          done(null);
        }
      })
      .catch(function () {
        hint.textContent = "カテゴリーの作成に失敗しました";

  function renderSuggestions() {
    var query = categorySearchInput.value.trim();
    var lower = query.toLowerCase();
    var candidates = allCategories.filter(function (c) {
      return selectedCategoryIds.indexOf(c.id) === -1 && (!lower || c.name.toLowerCase().indexOf(lower) !== -1);
    });
    categorySuggestionsEl.innerHTML = "";
    candidates.forEach(function (c) {
      var item = document.createElement("button");
      item.className = "category-suggestion-item";
      item.type = "button";
      item.textContent = c.name;
      item.addEventListener("click", function () { selectCategory(c.id); });
      categorySuggestionsEl.appendChild(item);
    });
    var exactMatch = allCategories.some(function (c) { return c.name.toLowerCase() === lower; });
    if (query && !exactMatch) {
      var createItem = document.createElement("button");
      createItem.className = "category-suggestion-item create-new";
      createItem.type = "button";
      createItem.textContent = "＋「" + query + "」を新規作成";
      createItem.addEventListener("click", function () {
        createItem.disabled = true;
        createCategory(query, function (created) {
          if (created) selectCategory(created.id);
        });
      });
      categorySuggestionsEl.appendChild(createItem);
    }
    categorySuggestionsEl.hidden = candidates.length === 0 && !(query && !exactMatch);
  }

  categorySearchInput.addEventListener("input", renderSuggestions);

  // --- 日付での絞り込み ---
  function parseLocalDate(dateStr, endOfDay) {
    // <input type="date">の値("YYYY-MM-DD")をローカルタイムゾーンの0時/23:59:59.999として解釈する
    var parts = dateStr.split("-");
    var y = Number(parts[0]), m = Number(parts[1]) - 1, d = Number(parts[2]);
    return endOfDay ? new Date(y, m, d, 23, 59, 59, 999).getTime() : new Date(y, m, d, 0, 0, 0, 0).getTime();
  }

  function applyDateFilter(posts) {
    var fromVal = dateFilterFrom.value;
    var toVal = dateFilterTo.value;
    if (!fromVal && !toVal) return posts;
    var fromTs = fromVal ? parseLocalDate(fromVal, false) : null;
    var toTs = toVal ? parseLocalDate(toVal, true) : null;
    return posts.filter(function (p) {
      var ts = p.createdAt || 0;
      if (fromTs !== null && ts < fromTs) return false;
      if (toTs !== null && ts > toTs) return false;
      return true;
    });
  }

  function applyAllFilters(posts) {
    return applyDateFilter(applyCategoryFilter(posts));
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    var hh = String(d.getHours()).padStart(2, "0");
    var mi = String(d.getMinutes()).padStart(2, "0");
    return yyyy + "/" + mm + "/" + dd + " " + hh + ":" + mi;
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }

  // KVは結果整合性のため、投稿/削除の直後は最大1分ほどGETに反映されないことがある。
  // 体験を損なわないよう、確定前の変更をローカルに保持してサーバー結果とマージする。
  var serverPosts = [];
  var localAdds = []; // {id, text, createdAt} まだGET結果に出てきていない自分の投稿
  var localDeletes = []; // GET結果からまだ消えていない、削除済みのid

  function mergedPosts() {
    var byId = {};
    serverPosts.forEach(function (p) { byId[p.id] = p; });
    localAdds.forEach(function (p) { if (!byId[p.id]) byId[p.id] = p; });
    localDeletes.forEach(function (id) { delete byId[id]; });
    var list = Object.keys(byId).map(function (k) { return byId[k]; });
    list.sort(function (a, b) { return b.createdAt - a.createdAt; });
    // サーバーに載った分はローカル差分から外す（掃除）
    localAdds = localAdds.filter(function (p) { return !serverPosts.some(function (s) { return s.id === p.id; }); });
    localDeletes = localDeletes.filter(function (id) { return serverPosts.some(function (s) { return s.id === id; }); });
    return list;
  }

  // 画像本体は/api/board/image/<id>から個別取得（一覧取得を軽く保つため）。
  // 取得済みのBlob URLはキャッシュして使い回す。
  var imageBlobCache = {};
  function getImageBlobUrl(imgId) {
    if (!imageBlobCache[imgId]) {
      imageBlobCache[imgId] = fetch("/api/board/image/" + encodeURIComponent(imgId), {
        headers: { "X-Board-Pin": currentPin },
      })
        .then(function (res) {
          if (!res.ok) throw new Error("load failed");
          return res.blob();
        })
        .then(function (blob) { return URL.createObjectURL(blob); });
    }
    return imageBlobCache[imgId];
  }

  function addCategoryToExistingPost(postId, categoryId, done) {
    fetch("/api/board/" + encodeURIComponent(postId), {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "X-Board-Pin": currentPin },
      body: JSON.stringify({ categoryId: categoryId }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("failed");
        return res.json();
      })
      .then(function (updated) {
        [serverPosts, localAdds].forEach(function (arr) {
          var target = arr.filter(function (p) { return p.id === postId; })[0];
          if (target) target.categories = updated.categories;
        });
        done(true);
      })
      .catch(function () { done(false); });
  }

  function downloadSequentially(urls, baseFilename, done) {
    var i = 0;
    function next() {
      if (i >= urls.length) { if (done) done(); return; }
      var idx = i++;
      var filename = baseFilename + (urls.length > 1 ? "-" + (idx + 1) : "") + ".jpg";
      urlToBlob(urls[idx])
        .then(function (blob) {
          saveBlob(filename, blob, function () {
            setTimeout(next, saveDirHandle ? 0 : 350);
          });
        })
        .catch(next);
    }
    next();
  }

  function buildSaveAllButton(data) {
    var legacyImages = data.image ? [data.image] : [];
    var newImageIds = Array.isArray(data.images) ? data.images : [];
    if (!legacyImages.length && !newImageIds.length) return null;

    var btn = document.createElement("button");
    btn.className = "save-all-btn";
    btn.type = "button";
    btn.textContent = "⬇ まとめて保存";
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      btn.disabled = true;
      btn.textContent = "保存中…";
      var promises = legacyImages.map(function (dataUrl) { return Promise.resolve(dataUrl); })
        .concat(newImageIds.map(function (id) { return getImageBlobUrl(id).catch(function () { return null; }); }));
      Promise.all(promises).then(function (urls) {
        var valid = urls.filter(Boolean);
        return new Promise(function (resolve) {
          downloadSequentially(valid, "miitobow-board-" + (data.createdAt || Date.now()), resolve);
        });
      }).finally(function () {
        btn.disabled = false;
        btn.textContent = "⬇ まとめて保存";
      });
    });
    return btn;
  }

  function buildAddCategoryWidget(data) {
    var wrap = document.createElement("div");
    wrap.className = "post-top";

    var saveAllBtn = buildSaveAllButton(data);
    if (saveAllBtn) wrap.appendChild(saveAllBtn);

    var btn = document.createElement("button");
    btn.className = "add-category-btn";
    btn.type = "button";
    btn.textContent = "＋ カテゴリー追加";

    var popup = document.createElement("div");
    popup.className = "add-category-popup";
    popup.hidden = true;
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "カテゴリーを検索 / 新規作成…";
    input.autocomplete = "off";
    var suggestions = document.createElement("div");
    suggestions.className = "add-category-suggestions";
    popup.appendChild(input);
    popup.appendChild(suggestions);

    function currentCategoryIds() {
      return Array.isArray(data.categories) ? data.categories : [];
    }

    function applyAdd(categoryId) {
      var already = currentCategoryIds();
      if (already.indexOf(categoryId) !== -1) {
        popup.hidden = true;
        input.value = "";
        return;
      }
      addCategoryToExistingPost(data.id, categoryId, function (ok) {
        if (ok) {
          popup.hidden = true;
          input.value = "";
          render(applyAllFilters(mergedPosts()));
        } else {
          hint.textContent = "カテゴリーの追加に失敗しました";
        }
      });
    }

    function renderSug() {
      var query = input.value.trim();
      var lower = query.toLowerCase();
      var already = currentCategoryIds();
      var candidates = allCategories.filter(function (c) {
        return already.indexOf(c.id) === -1 && (!lower || c.name.toLowerCase().indexOf(lower) !== -1);
      });
      suggestions.innerHTML = "";
      candidates.forEach(function (c) {
        var item = document.createElement("button");
        item.className = "category-suggestion-item";
        item.type = "button";
        item.textContent = c.name;
        item.addEventListener("click", function () { applyAdd(c.id); });
        suggestions.appendChild(item);
      });
      var exactMatch = allCategories.some(function (c) { return c.name.toLowerCase() === lower; });
      if (query && !exactMatch) {
        var createItem = document.createElement("button");
        createItem.className = "category-suggestion-item create-new";
        createItem.type = "button";
        createItem.textContent = "＋「" + query + "」を新規作成";
        createItem.addEventListener("click", function () {
          createItem.disabled = true;
          createCategory(query, function (created) {
            if (created) applyAdd(created.id);
          });
        });
        suggestions.appendChild(createItem);
      }
    }

    input.addEventListener("input", renderSug);
    input.addEventListener("focus", renderSug);
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      popup.hidden = !popup.hidden;
      if (!popup.hidden) {
        renderSug();
        input.focus();
      }
    });

    wrap.appendChild(btn);
    wrap.appendChild(popup);
    return wrap;
  }

  function render(posts) {
    postsEl.innerHTML = "";
    emptyMsg.hidden = posts.length > 0;
    countEl.textContent = posts.length ? posts.length + "件" : "";
    posts.forEach(function (data) {
      var card = document.createElement("div");
      card.className = "post";

      card.appendChild(buildAddCategoryWidget(data));

      var legacyImages = data.image ? [data.image] : [];
      var newImageIds = Array.isArray(data.images) ? data.images : [];
      if (legacyImages.length || newImageIds.length) {
        var grid = document.createElement("div");
        var totalCount = legacyImages.length + newImageIds.length;
        grid.className = "post-image-grid count-" + totalCount;

        legacyImages.forEach(function (dataUrl, i) {
          var imgLink = document.createElement("button");
          imgLink.type = "button";
          imgLink.className = "post-image-link";
          var imgEl = document.createElement("img");
          imgEl.className = "post-image";
          imgEl.src = dataUrl;
          imgEl.alt = "投稿画像";
          imgLink.appendChild(imgEl);
          var filename = "miitobow-board-" + (data.createdAt || Date.now()) + ".jpg";
          imgLink.addEventListener("click", function () { openLightbox(dataUrl, filename); });
          grid.appendChild(imgLink);
        });

        newImageIds.forEach(function (imgId, i) {
          var imgLink = document.createElement("button");
          imgLink.type = "button";
          imgLink.className = "post-image-link";
          var imgEl = document.createElement("img");
          imgEl.className = "post-image";
          imgEl.alt = "投稿画像";
          imgLink.appendChild(imgEl);
          grid.appendChild(imgLink);
          var filename = "miitobow-board-" + (data.createdAt || Date.now()) + "-" + (i + 1) + ".jpg";
          var resolvedUrl = null;
          getImageBlobUrl(imgId)
            .then(function (url) {
              imgEl.src = url;
              resolvedUrl = url;
            })
            .catch(function () {
              imgEl.alt = "画像の読み込みに失敗しました";
            });
          imgLink.addEventListener("click", function () {
            if (resolvedUrl) openLightbox(resolvedUrl, filename);
          });
        });

        card.appendChild(grid);
      }

      if (data.title) {
        var titleEl = document.createElement("div");
        titleEl.className = "post-title";
        titleEl.textContent = data.title;
        card.appendChild(titleEl);
      }

      if (data.text) {
        var textEl = document.createElement("div");
        textEl.className = "post-text";
        textEl.textContent = data.text;
        card.appendChild(textEl);
      }

      var postCategories = Array.isArray(data.categories) ? data.categories : [];
      if (postCategories.length) {
        var catRow = document.createElement("div");
        catRow.className = "post-categories";
        postCategories.forEach(function (cid) {
          var tag = document.createElement("span");
          tag.className = "post-category-tag";
          tag.textContent = categoryName(cid);
          catRow.appendChild(tag);
        });
        card.appendChild(catRow);
      }

      var foot = document.createElement("div");
      foot.className = "post-foot";

      var timeEl = document.createElement("span");
      timeEl.className = "post-time";
      timeEl.textContent = fmtTime(data.createdAt || 0);
      foot.appendChild(timeEl);

      var actions = document.createElement("div");
      actions.className = "post-actions";

      if (data.text || data.title) {
        var copyBtn = document.createElement("button");
        copyBtn.className = "btn-ghost";
        copyBtn.type = "button";
        copyBtn.textContent = "コピー";
        copyBtn.addEventListener("click", function () {
          var text = data.title ? (data.title + (data.text ? "\n" + data.text : "")) : (data.text || "");
          var done = function () {
            copyBtn.textContent = "コピーしました";
            copyBtn.classList.add("copied");
            setTimeout(function () {
              copyBtn.textContent = "コピー";
              copyBtn.classList.remove("copied");
            }, 1400);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
          } else {
            fallbackCopy(text, done);
          }
        });
        actions.appendChild(copyBtn);
      }

      var delBtn = document.createElement("button");
      delBtn.className = "btn-ghost danger";
      delBtn.type = "button";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click", function () {
        localDeletes.push(data.id);
        render(applyAllFilters(mergedPosts()));
        fetch("/api/board/" + encodeURIComponent(data.id), {
          method: "DELETE",
          headers: { "X-Board-Pin": currentPin },
        }).catch(function () {});
      });
      actions.appendChild(delBtn);

      foot.appendChild(actions);
      card.appendChild(foot);
      postsEl.appendChild(card);
    });
  }

  function loadPosts() {
    return fetch("/api/board", { headers: { "X-Board-Pin": currentPin } })
      .then(function (res) {
        if (res.status === 401) { throw new Error("unauthorized"); }
        return res.json();
      })
      .then(function (posts) {
        serverPosts = posts;
        render(applyAllFilters(mergedPosts()));
        if (hint.textContent === "読み込みに失敗しました") hint.textContent = "";
      })
      .catch(function () {
        hint.textContent = "読み込みに失敗しました";
      });
  }

  function submitPost() {
    var title = newTitle.value.trim();
    var text = newText.value.trim();
    var images = pendingImages.slice();
    if (!text && !images.length && !title) return;
    postBtn.disabled = true;
    hint.textContent = "";
    var categories = selectedCategoryIds.slice();
    var body = { text: text };
    if (title) body.title = title;
    if (images.length) body.images = images;
    if (categories.length) body.categories = categories;
    fetch("/api/board", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Board-Pin": currentPin },
      body: JSON.stringify(body),
    })
      .then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (err) {
            throw new Error(err.message || "failed");
          });
        }
        return res.json();
      })
      .then(function (created) {
        localAdds.push(created);
        render(applyAllFilters(mergedPosts()));
        newTitle.value = "";
        newText.value = "";
        pendingImages = [];
        renderImagePreview();
        selectedCategoryIds = [];
        renderSelectedChips();
      })
      .catch(function (err) {
        hint.textContent = (err && err.message) || "投稿に失敗しました";
      })
      .finally(function () {
        postBtn.disabled = false;
        newText.focus();
      });
  }

  function showBoard(pin) {
    currentPin = pin;
    lockEl.style.display = "none";
    boardEl.classList.add("show");
    postBtn.addEventListener("click", submitPost);
    newText.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submitPost();
    });
    newTitle.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); newText.focus(); }
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submitPost();
    });
    refreshBtn.addEventListener("click", function () {
      refreshBtn.disabled = true;
      refreshBtn.classList.add("spinning");
      loadPosts().finally(function () {
        refreshBtn.disabled = false;
        setTimeout(function () { refreshBtn.classList.remove("spinning"); }, 600);
      });
    });
    loadCategories().then(loadPosts);
    setInterval(loadPosts, 15000);
    setInterval(loadCategories, 60000);
  }

  function tryUnlock(pin) {
    fetch("/api/board", { headers: { "X-Board-Pin": pin } }).then(function (res) {
      if (res.status === 401) {
        lockError.classList.add("show");
        lockEl.classList.add("shake");
        setTimeout(function () { lockEl.classList.remove("shake"); }, 350);
        pinBoxes.forEach(function (b) { b.value = ""; });
        pinBoxes[0].focus();
        return;
      }
      try { sessionStorage.setItem(SESSION_KEY, pin); } catch (e) {}
      showBoard(pin);
    }).catch(function () {
      lockError.textContent = "通信に失敗しました";
      lockError.classList.add("show");
    });
  }

  pinBoxes.forEach(function (box, i) {
    box.addEventListener("input", function () {
      box.value = box.value.replace(/[^0-9]/g, "").slice(0, 1);
      if (box.value && i < pinBoxes.length - 1) pinBoxes[i + 1].focus();
      var joined = pinBoxes.map(function (b) { return b.value; }).join("");
      if (joined.length === 4) tryUnlock(joined);
    });
    box.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !box.value && i > 0) pinBoxes[i - 1].focus();
    });
  });
  pinForm.addEventListener("submit", function (e) { e.preventDefault(); });

  var savedPin = null;
  try { savedPin = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
  if (savedPin) {
    tryUnlock(savedPin);
  } else {
    pinBoxes[0].focus();
  }
})();
</script>
</body>
</html>
